name: Rotate Apple Client Secret

# Runs monthly to regenerate the Apple Sign In client secret before it expires.
# The secret has a max lifetime of 6 months, so monthly rotation is safe.

on:
  schedule:
    # First day of each month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - generate but do not update secrets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GCP_PROJECT_ID: hearthfire-491918
  # GCP auth uses a service-account key JSON (credentials_json: secrets.GCP_SA_KEY),
  # the same secret the deploy workflows use — NOT Workload Identity Federation.
  # If you see auth failures, verify the GCP_SA_KEY repo-level secret is a valid
  # key for a service account in the hearthfire-491918 project with permission to
  # add Secret Manager versions (and, for the revision roll, run.services.update).

jobs:
  rotate:
    name: Rotate Apple Client Secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Write Apple private key to file
        run: |
          echo "${{ secrets.APPLE_AUTH_KEY_P8 }}" > /tmp/apple-auth-key.p8

      - name: Generate new client secret
        id: generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_PRIVATE_KEY_PATH: /tmp/apple-auth-key.p8
        run: |
          # Run the generator and capture the secret
          OUTPUT=$(node scripts/generate-apple-client-secret.js 2>&1)
          echo "$OUTPUT"
          
          # Extract just the JWT (the line between the dashes)
          SECRET=$(echo "$OUTPUT" | grep -A1 "^─" | grep -v "^─" | head -1)
          
          if [ -z "$SECRET" ]; then
            echo "Failed to extract client secret from output"
            exit 1
          fi
          
          # Mask the secret in logs
          echo "::add-mask::$SECRET"
          echo "secret=$SECRET" >> $GITHUB_OUTPUT
          
          # Calculate expiration date (180 days from now)
          EXPIRES=$(date -d "+180 days" +%Y-%m-%d 2>/dev/null || date -v+180d +%Y-%m-%d)
          echo "expires=$EXPIRES" >> $GITHUB_OUTPUT

      - name: Clean up private key
        if: always()
        run: rm -f /tmp/apple-auth-key.p8

      - name: Authenticate to GCP
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        id: setup_gcloud
        # Retried below — see the note at the first occurrence in deploy-dev.yml.
        continue-on-error: true
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      # The dry-run guard has to be repeated, not just the outcome check: when
      # the step above is SKIPPED its outcome is 'skipped', not 'failure', so
      # the retry would correctly not fire — but the verify step below would,
      # and it must stay skipped on a dry run too.
      - name: Setup gcloud CLI (retry)
        if: ${{ github.event.inputs.dry_run != 'true' && steps.setup_gcloud.outcome == 'failure' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: gcloud version

      - name: Update secret in Google Secret Manager (production)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Add new version to the env-prefixed, Terraform-managed secret that
          # Cloud Run injects as APPLE_CLIENT_SECRET (see infra/terraform/secrets.tf:
          # container hf-{env}-apple-client-secret). The value is now owned by this
          # workflow; Terraform ignore_changes prevents apply from clobbering it.
          echo -n "${{ steps.generate.outputs.secret }}" | \
            gcloud secrets versions add hf-prod-apple-client-secret \
              --project=${{ env.GCP_PROJECT_ID }} \
              --data-file=-

          echo "Updated hf-prod-apple-client-secret in Google Secret Manager"
          echo "New secret expires: ${{ steps.generate.outputs.expires }}"

      - name: Update secret in Google Secret Manager (dev)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          # The generated JWT is identical for dev and prod (same Services ID
          # com.ithasfire.service, same signing key), so write the same value to
          # the dev env-prefixed secret. continue-on-error: a missing dev secret
          # must not fail the prod rotation.
          echo -n "${{ steps.generate.outputs.secret }}" | \
            gcloud secrets versions add hf-dev-apple-client-secret \
              --project=${{ env.GCP_PROJECT_ID }} \
              --data-file=- 2>/dev/null || echo "Dev secret hf-dev-apple-client-secret not found, skipping"

      - name: Roll API Cloud Run revisions to pick up new secret
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          # Cloud Run resolves secret_key_ref values at revision-create time, and the
          # API mounts APPLE_CLIENT_SECRET as version="latest" (api_secret_env in
          # secrets.tf sets only `secret`; the module defaults version to "latest").
          # So a new secret version is NOT served until a fresh revision rolls.
          #
          # Force a fresh revision by re-deploying the CURRENT image. We deliberately
          # do NOT touch service labels: the cloud-run-service module does not
          # ignore_changes on `labels` (only client/client_version), so a stray
          # rotation label would be reverted on the next `terraform apply`, churning
          # an extra revision and producing noisy plan diffs. Re-using the exact
          # current image string introduces no drift — it is the same image value
          # Terraform already expects (image is NOT ignored precisely so CI can move
          # the tag; see modules/cloud-run-service/main.tf). This mirrors the
          # deploy-*/redeploy-prod revision-force + traffic-pin pattern.
          #
          # Service names/regions are Terraform-derived (infra/terraform):
          #   - name  = "hf-${env}-api"  (modules/cloud-run-service: "${name_prefix}-${service_name}")
          #   - region = local.api_region = coalesce(var.api_region, var.region)
          #             = us-east4 for both dev and prod (envs/*/*.tfvars).
          # The API service is the only APPLE_CLIENT_SECRET consumer (api_secrets in
          # secrets.tf). This step is best-effort: a missing run.developer permission,
          # a scaled-to-zero/dark prod service, or a service still mid region-move
          # must NOT fail the rotation — the secret write above is the critical outcome.

          # "service region" pairs. Prod also probes us-central1 as a fallback while
          # the prod region cutover (us-central1 -> us-east4) is still pending.
          TARGETS=(
            "hf-dev-api us-east4"
            "hf-prod-api us-east4"
            "hf-prod-api us-central1"
          )

          for target in "${TARGETS[@]}"; do
            set -- $target
            SERVICE="$1"
            REGION="$2"
            echo "Rolling ${SERVICE} in ${REGION}..."

            # Read the currently-deployed image. If the service is absent/dark/in
            # another region, skip this target without failing the rotation.
            IMAGE=$(gcloud run services describe "${SERVICE}" \
              --region "${REGION}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --format='value(spec.template.spec.containers[0].image)' 2>/dev/null) || IMAGE=""
            if [ -z "${IMAGE}" ]; then
              echo "Skipped ${SERVICE} (${REGION}) — not found or image unreadable"
              continue
            fi

            # Re-deploy the same image to mint a fresh revision (picks up latest
            # secret version). No label churn, no image drift.
            if ! gcloud run services update "${SERVICE}" \
                --region "${REGION}" \
                --project="${{ env.GCP_PROJECT_ID }}" \
                --image "${IMAGE}" \
                --quiet; then
              echo "Skipped ${SERVICE} (${REGION}) — update not permitted"
              continue
            fi

            # Belt-and-suspenders: pin 100% traffic to the new revision. If the
            # service had drifted to a PINNED named revision (latestRevision:false),
            # the fresh revision — carrying the rotated secret — would otherwise get
            # 0% traffic and the OLD secret would keep serving until expiry.
            gcloud run services update-traffic "${SERVICE}" \
              --region "${REGION}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --to-latest --quiet || echo "Traffic pin skipped for ${SERVICE} (${REGION})"

            echo "Rolled ${SERVICE} (${REGION}) on image ${IMAGE}"
          done

      - name: Summary
        run: |
          echo "## Apple Client Secret Rotation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Dry run** - secret was generated but not updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "Secret successfully rotated in Google Secret Manager" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **New expiration date:** ${{ steps.generate.outputs.expires }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next rotation:** First of next month" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Note: the rotation rolls a fresh API revision so the new secret is picked up immediately. If that roll step was skipped (missing permission or dark/mid-move service), the value lands on the next deployment or restart." >> $GITHUB_STEP_SUMMARY
