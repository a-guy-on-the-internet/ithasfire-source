  # ── Terraform (dev auto-apply) ─────────────────────────────────────────
  terraform:
    name: Terraform apply (dev)
    # migrate_db is in `needs` so the SCHEMA ALWAYS PRECEDES REVISION CREATION.
    # terraform can create a new Cloud Run revision (any change to a service
    # template re-pulls the mutable :dev tag's current digest), so an infra-only
    # push could otherwise start serving an image carrying an unapplied
    # migration — and with the startup-probe drift guard on /health that
    # revision fails its probe (30 x 5s) and aborts `terraform apply` partway
    # through, leaving infra half-applied. terraform previously needed only
    # [changes, quality_gate] while migrate_db additionally needs all five
    # builds, so terraform always started strictly earlier and raced it.
    #
    # No cycle: migrate_db needs [changes, quality_gate, build_*] and does not
    # depend on terraform.
    #
    # Consequences accepted: (1) terraform now also waits on the builds
    # transitively, and a failed in-scope build blocks the infra apply — correct,
    # since that apply would roll a revision for a deploy that isn't happening;
    # use the standalone terraform-apply.yml workflow if infra must land anyway.
    # (2) On a FRESH-ENV BOOTSTRAP migrate_db can't succeed until terraform has
    # created hf-dev-database-url, which would deadlock — dispatch
    # `services=terraform,skip-migrate` once to break the circle (same one-time
    # bootstrap caveat deploy-prod.yml documents on its migrate_db).
    #
    # manifest_drift_guard is required to be `success`, not success-or-skipped
    # like quality_gate: its gate (do_terraform || do_jobs) is a superset of
    # this job's (do_terraform), so it cannot be skipped in a run where this
    # job runs. See its own note.
    needs: [changes, quality_gate, typecheck, manifest_drift_guard, migrate_db]
    if: >-
      always() && !cancelled() &&
      (needs.quality_gate.result == 'success' || needs.quality_gate.result == 'skipped') &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      needs.manifest_drift_guard.result == 'success' &&
      (
        needs.migrate_db.result == 'success' ||
        (needs.changes.outputs.skip_migrate == 'true' && needs.migrate_db.result == 'skipped')
      ) &&
      needs.changes.outputs.do_terraform == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.6

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Terraform init (cached)
        run: bash infra/terraform/scripts/tf-init-cached.sh infra/terraform -input=false

      - name: Select dev workspace
        run: terraform -chdir=infra/terraform workspace select dev || terraform -chdir=infra/terraform workspace new dev

      - name: Terraform apply (dev)
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_key: ${{ secrets.TF_VAR_CLOUDFLARE_API_KEY }}
          TF_VAR_cloudflare_email: ${{ secrets.TF_VAR_CLOUDFLARE_EMAIL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET_DEV }}
          TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET_DEV }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY_DEV }}
          TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET_DEV }}
          TF_VAR_origin_shared_secret: ${{ secrets.ORIGIN_SHARED_SECRET_DEV }}
          TF_VAR_consent_ip_hash_salt: ${{ secrets.CONSENT_IP_HASH_SALT_DEV }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY_DEV }}
          TF_VAR_resend_webhook_secret: ${{ secrets.RESEND_WEBHOOK_SECRET_DEV }}
          # ── AWS (Terraform provider for SES module — only used when enable_aws=true) ──
          TF_VAR_aws_access_key_id: ${{ secrets.TF_VAR_AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.TF_VAR_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_assume_role_arn: ${{ secrets.TF_VAR_AWS_ASSUME_ROLE_ARN }}
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
          TF_VAR_google_web_client_id: ${{ secrets.TF_VAR_GOOGLE_WEB_CLIENT_ID }}
          TF_VAR_google_ios_client_id: ${{ secrets.TF_VAR_GOOGLE_IOS_CLIENT_ID }}
          TF_VAR_google_android_client_id: ${{ secrets.TF_VAR_GOOGLE_ANDROID_CLIENT_ID }}
          TF_VAR_apple_client_id: ${{ secrets.TF_VAR_APPLE_CLIENT_ID }}
          TF_VAR_apple_client_secret: ${{ secrets.TF_VAR_APPLE_CLIENT_SECRET }}
          TF_VAR_apple_app_bundle_identifier: ${{ secrets.TF_VAR_APPLE_APP_BUNDLE_IDENTIFIER }}
          # Apple Wallet pass signing. Both default to null in variables.tf, so
          # omitting them here does not fail the apply — it silently leaves the
          # API on the stub wallet adapter. apple_team_id and
          # apple_pass_type_identifier are public and live in the tfvars.
          TF_VAR_apple_pass_certificate_p12_base64: ${{ secrets.APPLE_PASS_CERTIFICATE_P12_BASE64_DEV }}
          TF_VAR_apple_pass_certificate_password: ${{ secrets.APPLE_PASS_CERTIFICATE_PASSWORD_DEV }}
          TF_VAR_neon_api_key: ${{ secrets.TF_VAR_NEON_API_KEY }}
          TF_VAR_upstash_api_key: ${{ secrets.TF_VAR_UPSTASH_API_KEY }}
          TF_VAR_upstash_email: ${{ secrets.TF_VAR_UPSTASH_EMAIL }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL_DEV }}
          TF_VAR_meilisearch_master_key: ${{ secrets.MEILISEARCH_MASTER_KEY_DEV }}
          TF_VAR_ziptax_api_key: ${{ secrets.TF_VAR_ZIPTAX_API_KEY }}
          TF_VAR_geoapify_api_key: ${{ secrets.TF_VAR_GEOAPIFY_API_KEY }}
          TF_VAR_azure_content_safety_endpoint: ${{ secrets.TF_VAR_AZURE_CONTENT_SAFETY_ENDPOINT }}
          TF_VAR_azure_content_safety_key: ${{ secrets.TF_VAR_AZURE_CONTENT_SAFETY_KEY }}
          TF_VAR_jobs_api_key: ${{ secrets.JOBS_API_KEY_DEV }}
          TF_VAR_unsubscribe_secret: ${{ secrets.UNSUBSCRIBE_SECRET_DEV }}
          TF_VAR_volunteer_scan_token_secret: ${{ secrets.VOLUNTEER_SCAN_TOKEN_SECRET_DEV }}
          TF_VAR_discord_alerts_webhook: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          TF_VAR_discord_support_webhook: ${{ secrets.DISCORD_SUPPORT_WEBHOOK_DEV }}
          TF_VAR_sentry_dsn: ${{ secrets.TF_VAR_SENTRY_DSN }}
          TF_VAR_sentry_auth_token: ${{ secrets.TF_VAR_SENTRY_AUTH_TOKEN }}
          TF_VAR_storage_s3_access_key_id: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID_DEV }}
          TF_VAR_storage_s3_secret_access_key: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY_DEV }}
          TF_VAR_storage_s3_public_base_url: ${{ secrets.STORAGE_S3_PUBLIC_BASE_URL_DEV }}
        run: terraform -chdir=infra/terraform apply -auto-approve -no-color -input=false -var-file=envs/dev/dev.tfvars

  # ── Post-build ────────────────────────────────────────────────────────
  migrate_db:
    name: Run Prisma migrations (dev)
    needs:
      [
        changes,
        quality_gate,
        typecheck,
        build_api,
        build_web,
        build_jobs,
        build_tileserver,
        build_audio_transcoder,
      ]
    # STATE-DRIVEN, NOT DIFF-DRIVEN. Mirrors deploy-prod.yml's migrate_db, which
    # carries no scope gate at all.
    #
    # This was gated on needs.changes.outputs.do_migrate — a paths-filter diff of
    # the CURRENT push — to avoid hitting Neon (and burning compute quota) on a
    # scoped service-only roll. That tradeoff caused seven "column … does not
    # exist" (P2022) incidents in 90 days. The images are always built from the
    # whole tree, so they can carry migrations committed in EARLIER pushes that
    # were never applied (that run failed, was cancelled, or was a scoped
    # dispatch that omitted `migrate`). Once the DB falls behind it can NEVER
    # catch up on its own: every later apps-only push has do_migrate=false, skips
    # this job, and ships still more schema-dependent code onto the stale schema.
    # Correctness wins over the saved connection — `prisma migrate deploy` is
    # idempotent and a no-op when nothing is pending, so the steady-state cost is
    # one short DB connection.
    #
    # workflow_dispatch: the `services` input still scopes WHICH services get
    # built and rolled, but it can no longer scope migrations away — a scoped
    # service roll must not be able to ship code onto a stale schema, so
    # migrating is the default for every dispatch too. The ONLY opt-out is the
    # explicit `skip-migrate` break-glass token (see the `scope` step), which is
    # an incident action for a wedged DB, not a routine flag. do_migrate no
    # longer decides whether this job runs (it still gates quality_gate, where
    # `prisma validate` is worth running on a schema change).
    #
    # Two guards are kept, both written in the same explicit
    # `always() && (result == 'success' || result == 'skipped')` form every other
    # gate in this file uses. A bare `!failure()` would be equivalent under
    # GitHub's evaluator (a status-check function suppresses the implicit
    # needs-skip rule) but real CI here is FORGEJO Actions, and this file has no
    # precedent for that form; if Forgejo applied skip-propagation anyway,
    # migrate_db would be 'skipped' on nearly every push, deploy_dev's
    # `migrate_db.result == 'success'` would be false, and every dev deploy would
    # stop silently (the `notify` job is muted). Enumerate instead of relying on
    # evaluator subtleties.
    #
    #  1. Upstream health — if the quality gate or an in-scope build already
    #     broke, don't migrate for a roll that won't happen.
    #  2. Scope — skip only when this run builds and rolls NOTHING. paths-ignore
    #     covers just docs/**, **.md and .githooks/**, so a push touching only
    #     .github/workflows/**, apps/scanner/**, apps/mobile/**, .claude/** or
    #     scripts/** sets every do_* false: all builds skip, deploy_dev skips,
    #     and waking Neon plus a full pnpm install on the single-capacity runner
    #     buys nothing. This clause CANNOT reintroduce the original bug the way
    #     the old do_migrate-only gate did: if no image is built and no service
    #     is rolled, no new code can reach a stale schema, and the very next run
    #     that does build something migrates first. do_migrate stays in the OR
    #     only so a schema-only change still migrates on its own.
    if: >-
      always() && !cancelled() &&
      (needs.quality_gate.result == 'success' || needs.quality_gate.result == 'skipped') &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (needs.build_api.result == 'success' || needs.build_api.result == 'skipped') &&
      (needs.build_web.result == 'success' || needs.build_web.result == 'skipped') &&
      (needs.build_jobs.result == 'success' || needs.build_jobs.result == 'skipped') &&
      (needs.build_tileserver.result == 'success' || needs.build_tileserver.result == 'skipped') &&
      (needs.build_audio_transcoder.result == 'success' || needs.build_audio_transcoder.result == 'skipped') &&
      needs.changes.outputs.skip_migrate != 'true' &&
      (
        needs.changes.outputs.do_api == 'true' ||
        needs.changes.outputs.do_web == 'true' ||
        needs.changes.outputs.do_jobs == 'true' ||
        needs.changes.outputs.do_tileserver == 'true' ||
        needs.changes.outputs.do_audio == 'true' ||
        needs.changes.outputs.do_terraform == 'true' ||
        needs.changes.outputs.do_migrate == 'true'
      )
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Fetch DATABASE_URL from Secret Manager
        # Source of truth for the dev DB is the Terraform-managed Secret
        # Manager secret hf-dev-database-url (created by secrets.tf from
        # the Neon project's pooler URI). Avoids drift between a separate
        # DEV_DATABASE_URL Forgejo secret and what Cloud Run actually uses.
        run: |
          url="$(gcloud secrets versions access latest --secret=hf-dev-database-url --project=hearthfire-491918)"
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:gen

      - name: Run prisma migrate deploy
        run: pnpm db:migrate:deploy

      # Make drift loud and correctly attributed. This job is now the ONLY thing
      # standing between a stale dev schema and the roll, and the `notify` job
      # below is muted (`false &&`), so a red migration would otherwise be silent
      # until someone noticed P2022s on the dev homepage. Same shape as
      # terraform-apply.yml's migration-failure alert; best-effort, never fails
      # the job further (the migrate step itself already failed the run).
      - name: Report migration failure to Discord
        if: failure()
        env:
          # Passed via env, not interpolated into the script body: a webhook with
          # a shell metacharacter can't break (or be injected into) the script.
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && exit 0
          MSG="🟥 prisma migrate deploy (dev) FAILED — dev deploy + seed are BLOCKED and the dev DB is behind the built images. Commit \`${COMMIT_SHA}\`. Fix the migration and re-run: ${RUN_URL}"
          # `|| exit 0`: a python hiccup must not stack a second red step onto an
          # already-failed job and confuse which step actually broke.
          PAYLOAD=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"content": os.environ["MSG"]}))') || exit 0
          curl -fsSL -m 10 -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

      # GLOBAL fee policy. The platform fee is defined in CODE
      # (packages/core/src/lib/pricing/platform-fee-policy.ts) and this step
      # materializes it into the `FeePolicy` row that checkout snapshots and
      # `PayoutTerms.feePolicyId` pins. Idempotent in the strong sense: it
      # compares field-by-field and does nothing when the row already matches,
      # so the steady state is one SELECT, not a new policy version per deploy.
      #
      # WHY IT SITS IN migrate_db AND NOT NEXT TO THE CATEGORY/TAG SEEDS: on
      # dev those two live in `seed_admin`, which is gated on
      # `do_seed == 'true'` AND `deploy_dev == 'success'`, so a scoped dispatch
      # can skip them entirely. Categories and tags can wait for the next
      # deploy; an absent or stale GLOBAL fee policy cannot — `publishEvent`
      # throws FEE_POLICY_NOT_FOUND and checkout cannot price a ticket. This
      # job is state-driven and runs on every push that builds anything, so the
      # policy tracks the constant on the same cadence as the schema. It also
      # matches deploy-prod.yml, where the seeds do live in `migrate_db`.
      #
      # WHY IT IS *AFTER* the failure reporter above rather than before it:
      # that step is `if: failure()`, evaluated against job status SO FAR. Put
      # this step first and a fee-policy failure would fire an alert claiming
      # "prisma migrate deploy FAILED", sending whoever is on the hook chasing
      # a migration that was fine.
      #
      # DELIBERATELY NOT `continue-on-error` (unlike the catalogue seeds in
      # `seed_admin`): catalogue CONTENT must never hold a deploy hostage, but
      # this is the money path. Prod's first-ever publish failed with
      # FEE_POLICY_NOT_FOUND precisely because nothing ever installed this row.
      # Fail loudly.
      - name: Seed platform fee policy
        id: seed_fee_policy
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-platform-fee-policy.ts

      # WITHOUT THIS BLOCK A RED FEE-POLICY SEED IS A SILENT RED RUN. The only
      # other reporter in this job is the migration alert above, which is
      # `if: failure()` and therefore already evaluated (and skipped) by the
      # time this step runs — that is precisely why the seed sits after it. The
      # `notify` job at the bottom of this file is muted (`false &&`), so
      # nothing else would say a word. Keyed on the step's OUTCOME, matching the
      # outcome-keyed reporters in deploy-prod.yml.
      #
      # Note the step is NOT `continue-on-error`, so the job is already red by
      # the time this runs; `always()` is what lets it run at all. This is an
      # alert, not a rescue.
      - name: Report fee-policy seed failure to Discord
        if: always() && steps.seed_fee_policy.outcome == 'failure'
        env:
          # Passed via env, not interpolated into the script body: a webhook
          # with a shell metacharacter can't break (or be injected into) it.
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && exit 0
          MSG="🟥 GLOBAL fee policy seed (dev) FAILED — the dev deploy is BLOCKED. If no ACTIVE GLOBAL FeePolicy row exists, \`publishEvent\` throws FEE_POLICY_NOT_FOUND and checkout cannot price a ticket. NOTE: if the write succeeded and only the search REINDEX failed, the fee is live but every published event serves a stale fee-inclusive price — re-running the deploy will NOT retry it; run \`pnpm -F api reindex:search\` by hand. Commit \`${COMMIT_SHA}\`: ${RUN_URL}"
          # `|| exit 0`: a python hiccup must not stack a second red step onto
          # an already-failed job and confuse which step actually broke.
          PAYLOAD=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"content": os.environ["MSG"]}))') || exit 0
          curl -fsSL -m 10 -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

  deploy_dev:
    name: Deploy dev (roll Cloud Run)
    needs:
      [
        changes,
        quality_gate,
        typecheck,
        build_api,
        build_web,
        build_jobs,
        build_tileserver,
        build_audio_transcoder,
        migrate_db,
        terraform,
        manifest_drift_guard,
      ]
    # A build that's out of scope is 'skipped' (its do_* flag is false); a build
    # that ran and broke is 'failure'. Requiring every build to be success-OR-
    # skipped means ANY in-scope build failure blocks the entire roll — so we
    # never re-roll a stale tag against a migrated DB, and never ship a
    # half-built combo (e.g. new api + stale web). See the build-doesn't-gate-
    # roll footgun this closes.
    #
    # migrate_db is required to have SUCCEEDED. It is no longer diff-gated (see
    # its comment): whenever this run builds or rolls anything, migrate_db runs,
    # so in a healthy run its result is always 'success'. The old asymmetric rule
    # — accept 'skipped' when do_migrate != 'true' — was the other half of the
    # drift bug: it let an apps-only push roll code onto a DB still missing
    # migrations from an earlier failed run ("column … does not exist" 500s).
    #
    # 'skipped' is accepted in exactly ONE case: an operator dispatched the
    # `skip-migrate` break-glass token (see the `scope` step). Every other route
    # to 'skipped' — a failed quality gate, a failed build, an out-of-scope run —
    # must block the roll, and does: the build clauses above already reject the
    # failure cases, and an out-of-scope run is rejected by the do_* clause
    # below. A red migration therefore blocks the roll outright instead of
    # surfacing later as a confusing seed failure.
    #
    # manifest_drift_guard is in the gate for the same reason: `terraform`
    # accepts a skipped terraform, and a RED guard skips terraform — so without
    # this clause a red gate would read as an out-of-scope skip and the roll
    # would proceed past it. 'skipped' stays legitimate here (a web-only push
    # never runs the guard); 'failure' blocks the roll.
    if: >-
      always() && !cancelled() &&
      (needs.quality_gate.result == 'success' || needs.quality_gate.result == 'skipped') &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (needs.manifest_drift_guard.result == 'success' || needs.manifest_drift_guard.result == 'skipped') &&
      (needs.build_api.result == 'success' || needs.build_api.result == 'skipped') &&
      (needs.build_web.result == 'success' || needs.build_web.result == 'skipped') &&
      (needs.build_jobs.result == 'success' || needs.build_jobs.result == 'skipped') &&
      (needs.build_tileserver.result == 'success' || needs.build_tileserver.result == 'skipped') &&
      (needs.build_audio_transcoder.result == 'success' || needs.build_audio_transcoder.result == 'skipped') &&
      (
        needs.migrate_db.result == 'success' ||
        (needs.changes.outputs.skip_migrate == 'true' && needs.migrate_db.result == 'skipped')
      ) &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (
        needs.changes.outputs.do_api == 'true' ||
        needs.changes.outputs.do_web == 'true' ||
        needs.changes.outputs.do_jobs == 'true' ||
        needs.changes.outputs.do_tileserver == 'true' ||
        needs.changes.outputs.do_audio == 'true' ||
        needs.changes.outputs.do_terraform == 'true'
      )
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Deploy Cloud Run services (dev)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          AR_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          TAG: dev
          SERVICE_API_NAME: ${{ vars.CLOUD_RUN_DEV_API_SERVICE }}
          SERVICE_WEB_NAME: ${{ vars.CLOUD_RUN_DEV_WEB_SERVICE }}
          SERVICE_JOBS_NAME: ${{ vars.CLOUD_RUN_DEV_JOBS_SERVICE }}
          SERVICE_TILESERVER_NAME: ${{ vars.CLOUD_RUN_DEV_TILESERVER_SERVICE }}
          SERVICE_AUDIO_TRANSCODER_NAME: ${{ vars.CLOUD_RUN_DEV_AUDIO_TRANSCODER_SERVICE }}
          # Scope flags — only roll the services in the resolved deploy scope.
          # A web-only dispatch rolls ONLY web; a terraform-only dispatch rolls
          # nothing (no do_* service flag is set).
          DO_API: ${{ needs.changes.outputs.do_api }}
          DO_WEB: ${{ needs.changes.outputs.do_web }}
          DO_JOBS: ${{ needs.changes.outputs.do_jobs }}
          DO_TILESERVER: ${{ needs.changes.outputs.do_tileserver }}
          DO_AUDIO: ${{ needs.changes.outputs.do_audio }}
        run: |
          repo_host="${REGION}-docker.pkg.dev"

          deploy_service() {
            local svc="$1" img="$2"
            gcloud run deploy "$svc" \
              --region "$REGION" --image "$img" --quiet
            # Belt-and-suspenders: force 100% of traffic onto the revision we
            # just deployed. `gcloud run deploy` already promotes to latest by
            # default, but if a service has drifted to a PINNED named revision
            # (latestRevision:false) a plain deploy can leave the new revision
            # at 0% traffic — exactly the hf-dev-tileserver failure mode (green
            # pipeline, stale runtime). --to-latest repairs that pin in place.
            gcloud run services update-traffic "$svc" \
              --region "$REGION" --to-latest --quiet
          }

          # Consumer before producer: the API publishes messages (the upload-start
          # warm-up) that only a current transcoder acks.
          if [[ "$DO_AUDIO" == "true" && -n "${SERVICE_AUDIO_TRANSCODER_NAME:-}" ]]; then
            deploy_service "${SERVICE_AUDIO_TRANSCODER_NAME}" "${repo_host}/${PROJECT_ID}/${AR_REPO}/audio-transcoder:${TAG}"
          fi

          [[ "$DO_API" == "true" ]]        && deploy_service "${SERVICE_API_NAME}"        "${repo_host}/${PROJECT_ID}/${AR_REPO}/api:${TAG}"
          [[ "$DO_WEB" == "true" ]]        && deploy_service "${SERVICE_WEB_NAME}"        "${repo_host}/${PROJECT_ID}/${AR_REPO}/web:${TAG}"
          [[ "$DO_JOBS" == "true" ]]       && deploy_service "${SERVICE_JOBS_NAME}"       "${repo_host}/${PROJECT_ID}/${AR_REPO}/jobs:${TAG}"
          [[ "$DO_TILESERVER" == "true" ]] && deploy_service "${SERVICE_TILESERVER_NAME}" "${repo_host}/${PROJECT_ID}/${AR_REPO}/tileserver:${TAG}"
          # A skipped `[[ … ]] && …` line returns 1. As the script's last line it
          # would be the step's exit status, so end on an explicit success. A
          # failing deploy_service still fails the step: bash -e honours the
          # last command of an && list.
          exit 0

  post_deploy_verify:
    name: Post-deploy verification
    needs: [changes, deploy_dev]
    if: >-
      always() && !cancelled() &&
      needs.deploy_dev.result == 'success' &&
      (
        needs.changes.outputs.do_api == 'true' ||
        needs.changes.outputs.do_web == 'true' ||
        needs.changes.outputs.do_jobs == 'true' ||
        needs.changes.outputs.do_tileserver == 'true' ||
        needs.changes.outputs.do_audio == 'true' ||
        needs.changes.outputs.do_terraform == 'true'
      )
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Verify Cloud Run readiness and live endpoints
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE_API_NAME: ${{ vars.CLOUD_RUN_DEV_API_SERVICE }}
          SERVICE_WEB_NAME: ${{ vars.CLOUD_RUN_DEV_WEB_SERVICE }}
          SERVICE_JOBS_NAME: ${{ vars.CLOUD_RUN_DEV_JOBS_SERVICE }}
          SERVICE_TILESERVER_NAME: ${{ vars.CLOUD_RUN_DEV_TILESERVER_SERVICE }}
          SERVICE_AUDIO_TRANSCODER_NAME: ${{ vars.CLOUD_RUN_DEV_AUDIO_TRANSCODER_SERVICE }}
          WIF_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          # Scope flags — only describe/probe a service that was actually
          # rolled by deploy_dev. Services outside the scope are skipped, not
          # probed, so we never imply a deploy that didn't happen.
          DO_API: ${{ needs.changes.outputs.do_api }}
          DO_WEB: ${{ needs.changes.outputs.do_web }}
          DO_JOBS: ${{ needs.changes.outputs.do_jobs }}
          DO_TILESERVER: ${{ needs.changes.outputs.do_tileserver }}
          DO_AUDIO: ${{ needs.changes.outputs.do_audio }}
        run: |
          set -euo pipefail

          describe_service() {
            local service_name="$1"
            local label="$2"
            echo "Checking Cloud Run service: ${label} (${service_name})"
            gcloud run services describe "$service_name" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.conditions)'
          }

          get_service_url() {
            local service_name="$1"
            gcloud run services describe "$service_name" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --format='value(status.url)'
          }

          probe_url() {
            local label="$1"
            local url="$2"
            local auth="${3:-public}"  # "public" or "authed"
            echo "Probing ${label}: ${url}"
            # Dev services scale to zero: the first request after a roll boots
            # the container AND (for web SSR) warms the api + Neon chain, which
            # legitimately exceeds 30s. Retry the probe so a cold start doesn't
            # mark a healthy deploy red (2026-07-14: run #564 false-failed
            # exactly this way while every service was fine).
            #
            # --fail-with-body, NOT --fail: plain --fail DISCARDS the response
            # body on an HTTP error, so a drift 503 from /health surfaced only as
            # "curl: (22) ... returned error: 503" with the pending migration
            # names — the single most useful line in the whole run — thrown away.
            # --fail-with-body keeps the non-zero exit AND the body (curl >= 7.76;
            # ubuntu-latest ships 8.x).
            local curl_args=(--fail-with-body --silent --show-error --location
              --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors)
            local body rc=0
            body="$(mktemp)"
            if [[ "$auth" == "authed" ]]; then
              # Private service under Workload Identity Federation: there is no SA
              # key, so `print-identity-token --audiences` fails ("Invalid account
              # type for --audiences") — mint via impersonation instead. Both the
              # mint and the run.invoker binding for the CI SA may be absent, so
              # this HTTP probe is BEST-EFFORT (rc stays 0): the authoritative
              # readiness gate is the Cloud Run `Ready` condition already asserted
              # by describe_service above. Mirrors deploy-prod.yml.
              local token=""
              token="$(gcloud auth print-identity-token \
                --impersonate-service-account="${WIF_SA}" \
                --audiences="$url" --include-email 2>/dev/null)" || true
              if [[ -n "$token" ]]; then
                curl "${curl_args[@]}" -o "$body" -H "Authorization: Bearer ${token}" "$url" \
                  || echo "::warning::${label} HTTP probe failed (non-fatal; readiness gated via describe_service)"
              else
                echo "::warning::${label} HTTP probe skipped — could not mint an OIDC token under WIF (non-fatal; readiness gated via describe_service)"
              fi
            else
              curl "${curl_args[@]}" -o "$body" "$url" || rc=$?
            fi
            if (( rc != 0 )); then
              echo "::error::${label} probe FAILED (curl exit ${rc}). Response body:"
              head -c 4000 "$body" || true
              echo
            fi
            rm -f "$body"
            return "$rc"
          }

          # Only describe + probe services in the resolved deploy scope.
          # api/web/tileserver are public; jobs and audio-transcoder are
          # private Cloud Run services, so probe them with an OIDC token.
          if [[ "$DO_API" == "true" ]]; then
            describe_service "$SERVICE_API_NAME" api
            api_url="$(get_service_url "$SERVICE_API_NAME")"
            [[ -n "$api_url" ]]
            probe_url "api /health" "${api_url%/}/health"
          fi

          if [[ "$DO_JOBS" == "true" ]]; then
            describe_service "$SERVICE_JOBS_NAME" jobs
            jobs_url="$(get_service_url "$SERVICE_JOBS_NAME")"
            [[ -n "$jobs_url" ]]
            probe_url "jobs /health" "${jobs_url%/}/health" authed
          fi

          if [[ "$DO_WEB" == "true" ]]; then
            describe_service "$SERVICE_WEB_NAME" web
            web_url="$(get_service_url "$SERVICE_WEB_NAME")"
            [[ -n "$web_url" ]]
            probe_url "web /" "${web_url%/}/"
          fi

          if [[ "$DO_TILESERVER" == "true" ]]; then
            describe_service "$SERVICE_TILESERVER_NAME" tileserver
            tileserver_url="$(get_service_url "$SERVICE_TILESERVER_NAME")"
            [[ -n "$tileserver_url" ]]
            probe_url "tileserver /health" "${tileserver_url%/}/health"
          fi

          if [[ "$DO_AUDIO" == "true" && -n "${SERVICE_AUDIO_TRANSCODER_NAME:-}" ]]; then
            # ingress=internal, so it's unreachable from the public CI runner.
            # Trust the describe_service Ready=True signal instead of an HTTP probe.
            describe_service "$SERVICE_AUDIO_TRANSCODER_NAME" audio-transcoder
            transcoder_url="$(get_service_url "$SERVICE_AUDIO_TRANSCODER_NAME")"
            [[ -n "$transcoder_url" ]]
          fi

      # Search index format check (search.ensure-format). Fired once, AFTER
      # the jobs service rolled, so the revision that compares
      # SEARCH_INDEX_FORMAT_VERSION is the one that rebuilds. Non-destructive
      # and idempotent (a claim absorbs redelivery); a current index is a
      # one-row read. NON-FATAL: the nightly search.full-reindex records the
      # version too, so a missed publish self-heals by the next night.
      - name: Trigger search index format check
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DO_JOBS: ${{ needs.changes.outputs.do_jobs }}
        run: |
          # Only when this run rolled the jobs service.
          if [[ "$DO_JOBS" != "true" ]]; then
            echo "jobs not rolled this run; skipping"
            exit 0
          fi
          topic="projects/${PROJECT_ID}/topics/dev-hf-trigger-search-ensure-format"
          if gcloud pubsub topics publish "$topic" --message='{}' --project "$PROJECT_ID"; then
            echo "Published search.ensure-format trigger to ${topic}"
          else
            echo "::warning::Could not publish search.ensure-format (non-fatal; the nightly search.full-reindex records the format version)"
          fi

  # ── Seed admin ────────────────────────────────────────────────────────
  # Dev is a known-fixture environment: the admin account is intentionally
  # the same as local seed (apps/api/src/scripts/seed/ids.ts) so scanners,
  # web, and local devs all use one set of test creds. Runs after every
  # successful deploy — `seed-platform-admin.ts` is an upsert, so re-running
  # only refreshes the password / verified flag and is cheap.
  #
  # These creds are NOT secret — they're test fixtures. Anything sensitive
  # belongs in prod (which uses separate secrets, see deploy-prod.yml).
  seed_admin:
    name: Seed platform admin (dev)
    needs: [changes, deploy_dev, migrate_db]
    # migrate_db must have SUCCEEDED. This previously used a bare `always()` and
    # never inspected needs.migrate_db.result, so it ran even when migrations
    # were skipped or failed — and seeding a stale schema dies with a misleading
    # `P2022 ColumnNotFound` inside seed-platform-admin.ts, which masks the real
    # problem (an un-applied migration) as a seed bug. `always()` is still needed
    # so the job is evaluated when in-scope builds were skipped, but every needed
    # result is now checked explicitly.
    #
    # STRICTER than the deploy_dev gate on purpose: `skip-migrate` does NOT
    # relax this. Break-glass exists to get a code roll out against a knowingly
    # stale schema; re-seeding fixtures into that schema is not urgent and is
    # the exact scenario that produces the misleading P2022 above. Once the
    # migration is fixed, dispatch a normal deploy (e.g. `services=all`) — note
    # `services=seed` alone can never seed, since it rolls nothing and this job
    # requires deploy_dev == 'success'.
    if: >-
      always() && !cancelled() &&
      needs.deploy_dev.result == 'success' &&
      needs.migrate_db.result == 'success' &&
      needs.changes.outputs.do_seed == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:gen

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Fetch DATABASE_URL from Secret Manager
        run: |
          url="$(gcloud secrets versions access latest --secret=hf-dev-database-url --project=hearthfire-491918)"
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"

      - name: Seed platform admin
        run: |
          pnpm -F api exec tsx src/scripts/reference-data/seed-platform-admin.ts \
            --email 'admin@ithasfire.com' \
            --password 'Dev-Login-2026!' \
            --name 'Platform Admin' \
            --email-verified

      - name: Seed platform categories
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-platform-categories.ts

      - name: Seed platform tags
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-platform-tags.ts

      # Volunteer role packs (FR-018). Runs AFTER categories: pack targeting is
      # resolved by category slug.
      #
      # INSTALL-ONLY, matching prod. No `--refresh`, no `--prune`: the
      # catalogue is DB-managed from the first install on (staff author it at
      # /platform/volunteer-packs), and this job runs on every dev push. The
      # step creates rows that are missing and never overwrites or deletes
      # staff-authored content. To force the git baseline over a dev DB, run
      # `pnpm seed:volunteer-packs:refresh` by hand — or `pnpm seed:dev`, which
      # wipes and reseeds with refresh + prune on. See the header of
      # apps/api/src/scripts/seed/volunteer-packs.ts.
      #
      # `continue-on-error`: the step throws on CONTENT problems (anchored
      # shift bounds, duplicate names, a zod parse) and talks to Neon. This
      # job (`seed_admin`) already runs AFTER `deploy_dev`, so a red step here
      # cannot roll anything back — but it would still red the run and bury
      # the signal for whatever actually broke. Catalogue content never fails
      # a deploy; it alerts.
      - name: Seed volunteer role packs
        id: seed_volunteer_packs
        continue-on-error: true
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-volunteer-packs.ts

      # Same shape as the migration-failure alert above. `failure()` would not
      # fire — `continue-on-error` keeps the job green — so this keys off the
      # step's own outcome. Best-effort; never fails the job.
      - name: Report volunteer-pack seed failure to Discord
        if: steps.seed_volunteer_packs.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && exit 0
          MSG="🟧 Volunteer role-pack seed (dev) FAILED — the deploy itself is UNAFFECTED (install-only, non-blocking), but the launch catalogue may be missing or partially installed. Commit \`${COMMIT_SHA}\`. Check /platform/volunteer-packs: ${RUN_URL}"
          PAYLOAD=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"content": os.environ["MSG"]}))') || exit 0
          curl -fsSL -m 10 -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

      # Ticket-type packs (ticket-type-packs spec FR-013). Same contract as
      # the volunteer step above: INSTALL-ONLY, non-blocking, alerts instead
      # of failing the deploy. To force the git baseline over a dev DB, run
      # `pnpm seed:ticket-packs:refresh` by hand — or `pnpm seed:dev`.
      - name: Seed ticket-type packs
        id: seed_ticket_packs
        continue-on-error: true
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-ticket-packs.ts

      # Application-form starter catalogue (application-driven-events spec
      # Phase 4). INSTALL-ONLY, non-blocking. To force the git baseline over a
      # dev DB, run `pnpm seed:application-form-templates:refresh` by hand —
      # or `pnpm seed:dev`.
      - name: Seed application-form templates
        id: seed_application_form_templates
        continue-on-error: true
        run: pnpm -F api exec tsx src/scripts/reference-data/seed-application-form-templates.ts

      - name: Report ticket-pack seed failure to Discord
        if: steps.seed_ticket_packs.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && exit 0
          MSG="🟧 Ticket-type pack seed (dev) FAILED — the deploy itself is UNAFFECTED (install-only, non-blocking), but the launch catalogue may be missing or partially installed. Commit \`${COMMIT_SHA}\`. Check /platform/ticket-packs: ${RUN_URL}"
          PAYLOAD=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"content": os.environ["MSG"]}))') || exit 0
          curl -fsSL -m 10 -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

      # WITHOUT THIS BLOCK THE SEED STEP IS A GATE THAT LOOKS REAL: it is
      # `continue-on-error`, so a zod parse error or a Neon connection failure
      # leaves the job GREEN and `failure()` never fires. Keyed on the step's
      # OUTCOME, exactly like the two reporters above.
      - name: Report application-form-template seed failure to Discord
        if: steps.seed_application_form_templates.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && exit 0
          MSG="🟧 Application-form template seed (dev) FAILED — the deploy itself is UNAFFECTED (install-only, non-blocking), but the starter catalogue may be missing or partially installed, so the template picker will look empty. Commit \`${COMMIT_SHA}\`. Re-run by hand with \`pnpm seed:application-form-templates:refresh\`: ${RUN_URL}"
          PAYLOAD=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"content": os.environ["MSG"]}))') || exit 0
          curl -fsSL -m 10 -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

  # ── Discord notification ──────────────────────────────────────────────
  notify:
    name: Notify deploy result
    needs:
      [
        changes,
        quality_gate,
        typecheck,
        build_api,
        build_web,
        build_jobs,
        build_tileserver,
        terraform,
        migrate_db,
        deploy_dev,
        post_deploy_verify,
      ]
    # Disabled — every push was firing a Discord notification and that's
    # noise. Re-enable by removing the `false &&` once we want the dev-deploy
    # status pings back. Manual `workflow_dispatch` runs still post nothing,
    # which is the intended muted state.
    if: >-
      false && always() && !cancelled() &&
      (
        needs.changes.outputs.any_app == 'true' ||
        needs.changes.outputs.tileserver == 'true' ||
        needs.changes.outputs.infra == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Post to Discord
        env:
          # success = deploy landed and post-deploy verification passed
          RESULT: >-
            ${{
              needs.post_deploy_verify.result == 'success' && 'success' ||
              contains(needs.*.result, 'failure') && 'failure' ||
              'failure'
            }}
        run: |
          STATUS_ICON=$( [ "$RESULT" = "success" ] && echo "✅" || echo "❌" )
          COLOUR=$( [ "$RESULT" = "success" ] && echo "3066993" || echo "15158332" )

          # Build prod deploy link (only shown on success)
          PROD_URL="${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-prod.yml"
          PROD_FIELD=""
          if [ "$RESULT" = "success" ]; then
            PROD_FIELD=",{\"name\": \"🚀 Push to Prod?\", \"value\": \"[Deploy to production](${PROD_URL})\", \"inline\": false}"
          fi

          curl -fsSL -X POST "${{ secrets.DISCORD_DEPLOY_DEV_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${STATUS_ICON} Deploy DEV — ${RESULT}\",
                \"color\": ${COLOUR},
                \"fields\": [
                  {\"name\": \"Commit\",  \"value\": \"\`${{ github.sha }}\`\",           \"inline\": true},
                  {\"name\": \"Branch\",  \"value\": \"\`${{ github.ref_name }}\`\",       \"inline\": true},
                  {\"name\": \"Actor\",   \"value\": \"\`${{ github.actor }}\`\",          \"inline\": true},
                  {\"name\": \"Run\",     \"value\": \"[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }})\", \"inline\": false}
                  ${PROD_FIELD}
                ]
              }]
            }"
