name: Deploy dev

# Deploys on every push to main. Quality is gated server-side here before
# build/deploy work starts, in addition to local hooks and CI on main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".githooks/**"
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to build+roll (web,api,jobs,tileserver,audio). Use 'all' for the full pipeline incl. terraform/migrate/seed."
        required: false
        default: "web"

permissions:
  contents: read

concurrency:
  # Shared group with terraform-apply so a deploy-dev and a manual
  # terraform-apply against dev can't race on the GCS state lock.
  group: hf-dev
  cancel-in-progress: true

jobs:
  # ── Change detection ──────────────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      jobs: ${{ steps.filter.outputs.jobs }}
      tileserver: ${{ steps.filter.outputs.tileserver }}
      audio_transcoder: ${{ steps.filter.outputs.audio_transcoder }}
      any_app: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.jobs == 'true' || steps.filter.outputs.audio_transcoder == 'true' }}
      infra: ${{ steps.filter.outputs.infra }}
      migrations: ${{ steps.filter.outputs.migrations }}
      # ── Scoped-deploy decision (see the `scope` step below) ──
      # On push these mirror the path-filter outputs. On workflow_dispatch
      # they reflect the maintainer-supplied `services` input so a deploy can
      # be narrowed to a single service without touching terraform/migrate/seed.
      do_api: ${{ steps.scope.outputs.do_api }}
      do_web: ${{ steps.scope.outputs.do_web }}
      do_jobs: ${{ steps.scope.outputs.do_jobs }}
      do_tileserver: ${{ steps.scope.outputs.do_tileserver }}
      do_audio: ${{ steps.scope.outputs.do_audio }}
      do_terraform: ${{ steps.scope.outputs.do_terraform }}
      do_migrate: ${{ steps.scope.outputs.do_migrate }}
      do_seed: ${{ steps.scope.outputs.do_seed }}
      # Break-glass opt-out (workflow_dispatch only) — see the `skip-migrate`
      # token in the `scope` step. Never 'true' on a push.
      skip_migrate: ${{ steps.scope.outputs.skip_migrate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'prisma.config.ts'
            api:
              - *shared
              - 'apps/api/**'
            web:
              - *shared
              - 'apps/web/**'
            jobs:
              - *shared
              - 'apps/jobs/**'
            tileserver:
              - 'infra/docker/tileserver/**'
              - 'infra/docker/Dockerfile.tileserver'
            audio_transcoder:
              - *shared
              - 'apps/audio-transcoder/**'
            infra:
              - 'infra/terraform/**'
              - 'apps/jobs/jobs.manifest.json'
            migrations:
              - 'packages/db/prisma/migrations/**'
              - 'packages/db/prisma/**.prisma'

      # ── Resolve the scoped-deploy decision ──────────────────────────────
      # Centralizes the build/roll/terraform/migrate/seed gating so every
      # downstream job reads a single boolean instead of re-deriving the
      # push-vs-dispatch + path-filter logic. Emits strings 'true'/'false'.
      - name: Resolve deploy scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICES_INPUT: ${{ inputs.services }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_JOBS: ${{ steps.filter.outputs.jobs }}
          FILTER_TILESERVER: ${{ steps.filter.outputs.tileserver }}
          FILTER_AUDIO: ${{ steps.filter.outputs.audio_transcoder }}
          FILTER_INFRA: ${{ steps.filter.outputs.infra }}
          FILTER_MIGRATIONS: ${{ steps.filter.outputs.migrations }}
        run: |
          set -euo pipefail

          # Normalize a raw value to the string 'true' or 'false'.
          norm() { [[ "${1:-}" == "true" ]] && echo "true" || echo "false"; }

          do_api=false
          do_web=false
          do_jobs=false
          do_tileserver=false
          do_audio=false
          do_terraform=false
          do_migrate=false
          do_seed=false
          # Break-glass only, and only reachable via workflow_dispatch. A push
          # can never set this — the DB must always be allowed to catch up.
          skip_migrate=false

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            # ── push: mirror the path-filter outputs ──
            do_api="$(norm "$FILTER_API")"
            do_web="$(norm "$FILTER_WEB")"
            do_jobs="$(norm "$FILTER_JOBS")"
            do_tileserver="$(norm "$FILTER_TILESERVER")"
            do_audio="$(norm "$FILTER_AUDIO")"
            do_terraform="$(norm "$FILTER_INFRA")"
            do_migrate="$(norm "$FILTER_MIGRATIONS")"
            # any_app || tileserver || infra
            if [[ "$do_api" == "true" || "$do_web" == "true" || "$do_jobs" == "true" || "$do_audio" == "true" || "$do_tileserver" == "true" || "$do_terraform" == "true" ]]; then
              do_seed=true
            fi
          else
            # ── workflow_dispatch: honour the maintainer-supplied list ──
            # Lowercase, split on comma, trim each token.
            raw="$(printf '%s' "${SERVICES_INPUT:-web}" | tr '[:upper:]' '[:lower:]')"
            tokens=()
            IFS=',' read -ra parts <<< "$raw"
            for p in "${parts[@]}"; do
              t="$(printf '%s' "$p" | tr -d '[:space:]')"
              [[ -n "$t" ]] && tokens+=("$t")
            done

            has() {
              local needle="$1" tok
              for tok in "${tokens[@]}"; do
                [[ "$tok" == "$needle" ]] && return 0
              done
              return 1
            }

            # ── Break-glass: `skip-migrate` ─────────────────────────────────
            # INCIDENT ACTION, NOT ROUTINE. Migrations are otherwise mandatory
            # on every run (see migrate_db) precisely because a diff-gated
            # migration let the dev DB fall permanently behind. But a dev DB can
            # get wedged so that `prisma migrate deploy` fails every time — e.g.
            # P3009 after a run was cancelled mid-migration, which this workflow
            # can cause via `concurrency.cancel-in-progress: true` above. Without
            # an escape hatch that state would also block every urgent hotfix
            # roll, since deploy_dev hard-requires migrate_db success.
            #
            # `skip-migrate` skips migrate_db and relaxes the terraform +
            # deploy_dev gates to accept 'skipped'. It knowingly ships code onto
            # a schema we could not bring up to date — use it to restore service,
            # then fix the migration and re-run a normal deploy. Mirrors the
            # `skip_migrate` input on terraform-apply.yml.
            #
            # It is also the documented way out of a fresh-env bootstrap
            # deadlock: on a brand-new dev env the hf-dev-database-url secret
            # doesn't exist yet, so migrate_db cannot succeed until terraform has
            # created it — dispatch `terraform,skip-migrate` once to break the
            # circle, then deploy normally.
            #
            # ⚠ SKIP-MIGRATE ALONE IS NOT ENOUGH — READ THIS DURING AN INCIDENT.
            # api and jobs both run a migration-drift guard that returns 503 from
            # /health when the running image needs migrations the DB doesn't have,
            # and both Cloud Run services have a startup probe on /health. So on a
            # wedged DB the rolled revision never becomes Ready: `skip-migrate`
            # skips the migration but the hotfix still does not ship. To actually
            # ship, ALSO disable enforcement, in ONE of these two ways:
            #
            #  1. Preferred, whole-environment:
            #     set `migration_drift_enforce = "false"` in
            #     infra/terraform/envs/<env>/<env>.tfvars and apply. That sets
            #     MIGRATION_DRIFT_ENFORCE on the api + jobs revisions.
            #     Accepted values: false|0|off (disable) / true|1|on (force on).
            #     It disables ENFORCEMENT ONLY — detection, logging and Sentry
            #     reporting all continue, and the guard additionally logs
            #     `migration_drift_enforcement_disabled` at error level and
            #     reports to Sentry on EVERY boot while it is set.
            #     REVERT IT AFTERWARDS: delete the line (null is the correct
            #     resting state, not "true") and apply again.
            #
            #  2. Cheaper, jobs only: set `startup_probe_path = null` on the jobs
            #     module. Drops that service's probe without weakening drift
            #     enforcement anywhere. Use when only the jobs roll is blocked.
            #
            # Rationale and full procedure: see the `migration_drift_enforce`
            # variable in infra/terraform/variables.tf.
            if has skip-migrate; then
              skip_migrate=true
            fi

            if has all; then
              # Full pipeline — reproduces today's dispatch behavior.
              do_api=true
              do_web=true
              do_jobs=true
              do_tileserver=true
              do_audio=true
              do_terraform=true
              do_migrate=true
              do_seed=true
            else
              has api        && do_api=true
              has web        && do_web=true
              has jobs       && do_jobs=true
              has tileserver && do_tileserver=true
              has audio      && do_audio=true
              { has terraform || has infra; }      && do_terraform=true
              { has migrate   || has migrations; } && do_migrate=true
              has seed       && do_seed=true

              # Fail loudly on a typo'd input instead of a green do-nothing run.
              # NOTE: skip_migrate is deliberately NOT part of this check —
              # it's a modifier, not a target, so `services=skip-migrate` alone
              # must still fail as "nothing to deploy".
              if [[ "$do_api$do_web$do_jobs$do_tileserver$do_audio$do_terraform$do_migrate$do_seed" != *true* ]]; then
                echo "::error::Unrecognized services input '${SERVICES_INPUT}'. Use a comma list of: web, api, jobs, tileserver, audio, terraform, migrate, seed — or 'all'. ('skip-migrate' is a break-glass modifier and must accompany a service.)"
                exit 1
              fi
            fi

            # Contradictory scope: 'all' and 'migrate' both request migrations.
            # Silently picking a winner here is how a break-glass roll turns
            # into an accidental un-migrated deploy (or vice versa) — fail.
            if [[ "$skip_migrate" == "true" && "$do_migrate" == "true" ]]; then
              echo "::error::Contradictory services input '${SERVICES_INPUT}': 'skip-migrate' cannot be combined with 'migrate'/'migrations'/'all'."
              exit 1
            fi
          fi

          {
            echo "do_api=${do_api}"
            echo "do_web=${do_web}"
            echo "do_jobs=${do_jobs}"
            echo "do_tileserver=${do_tileserver}"
            echo "do_audio=${do_audio}"
            echo "do_terraform=${do_terraform}"
            echo "do_migrate=${do_migrate}"
            echo "do_seed=${do_seed}"
            echo "skip_migrate=${skip_migrate}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved scope (event=${EVENT_NAME}, services='${SERVICES_INPUT:-}'):"
          echo "  api=${do_api} web=${do_web} jobs=${do_jobs} tileserver=${do_tileserver} audio=${do_audio}"
          echo "  terraform=${do_terraform} migrate=${do_migrate} seed=${do_seed}"
          if [[ "$skip_migrate" == "true" ]]; then
            echo "::warning::BREAK-GLASS: skip-migrate requested — migrate_db will be SKIPPED and the roll will proceed against the current (possibly stale) schema. Fix the migration and re-run a normal deploy."
          fi

  # ── CI coverage guard ─────────────────────────────────────────────────
  # Its own job, with NO `needs` and NO path gating, deliberately.
  #
  # It was first written as a step inside `quality_gate` — which is gated on
  # an app/service having changed, so a push touching only .github/workflows
  # or scripts/ skips it entirely. That is precisely the push most likely to
  # break CI wiring: run #667 (this guard's own commit) skipped every job in
  # this workflow. A check on CI configuration that does not run when CI
  # configuration changes is the thing it exists to detect.
  #
  # Cheap enough to be unconditional: the script imports only node builtins,
  # so this is a checkout and a node run — no pnpm install, no Postgres, a
  # few seconds on a single-capacity runner.
  ci_coverage_guard:
    name: CI coverage guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check CI test coverage is real
        run: node scripts/ci/check-ci-test-coverage.mjs

  quality_gate:
    name: Server-side quality gate
    needs: [changes]
    # Superset of every build/migrate gate so a build always has its gate.
    if: >-
      needs.changes.outputs.do_api == 'true' ||
      needs.changes.outputs.do_web == 'true' ||
      needs.changes.outputs.do_jobs == 'true' ||
      needs.changes.outputs.do_tileserver == 'true' ||
      needs.changes.outputs.do_audio == 'true' ||
      needs.changes.outputs.do_migrate == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TILESERVER_URL: "https://tiles-dev.ithasfire.com"
      NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ vars.NEXT_PUBLIC_GEOAPIFY_API_KEY }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=2s --health-retries=10
      # Required by apps/api's auth-atomic-rate-limit-concurrency suite, which
      # proves the auth pre-limiter is atomic under concurrency — the one
      # property a mocked RateLimitPort cannot show (it is atomic by
      # construction). @th/test-utils' startRedisContainer picks this up via
      # TESTCONTAINERS_REUSE_REDIS_URL on the test step; without the service it
      # would fall back to Docker-in-Docker Testcontainers, which is not
      # reachable from a job container (same constraint as the Postgres service
      # above).
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h postgres -p 5432 -U postgres && break || sleep 3
          done

      - name: Prisma validate + generate + migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dev
        run: |
          pnpm -F @th/db exec prisma validate
          pnpm exec prisma generate
          pnpm -F @th/db exec prisma migrate deploy --config ../../prisma.config.ts

      - name: Lint + Test (parallel)
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dev
          # Explicitly point @th/test-utils' Postgres helper at the service
          # container instead of letting it try to spawn its own with
          # Testcontainers. Forgejo Actions doesn't reliably set CI=true, and
          # nested-docker testcontainers don't work from job containers anyway.
          TESTCONTAINERS_REUSE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dev
          # Same deal for Redis: apps/api's auth-atomic-rate-limit-concurrency
          # suite needs a REAL Redis to prove the auth pre-limiter is atomic
          # under concurrency (a mocked RateLimitPort is atomic by construction
          # and proves nothing). Points @th/test-utils' startRedisContainer at
          # the `redis` service container declared on this job.
          TESTCONTAINERS_REUSE_REDIS_URL: redis://redis:6379
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          # @th/ui-email resolves via its BUILT dist by design (apps/api's vitest
          # config deliberately does not alias it to src — .eta templates). The
          # api suite imports it through the mailer adapters, so build it BEFORE
          # the fan-out or all of test/stripe-webhook.test.ts fails on
          # "Failed to resolve entry for package @th/ui-email" (runs 590/594).
          pnpm -F @th/ui-email build
          # SEQUENTIAL since 2026-07-28: the parallel fan-out made every gate
          # run a dice roll — seven concurrent vitest suites on this single Mac
          # produced a DIFFERENT contention flake per run (ui 590/600/616,
          # types 598, trpc 602/610-collect, web 608/612, jobs-app 615, plus a
          # full 1h37m hang in 614) while every suite passes alone. Lint stays
          # backgrounded (I/O-light); each suite now gets the whole box.
          # Retries/timeouts kept as belt-and-braces. Costs ~10 extra minutes;
          # buys a deterministic gate.
          pnpm lint &
          LINT_PID=$!
          FAIL=0
          # EVERY suite below MUST keep its `|| FAIL=1`. Without it a red suite is
          # swallowed by the next command's exit status and the gate goes green,
          # which in this pipeline re-rolls the PREVIOUS image and looks like a
          # successful deploy.
          # @th/types — money, safe-external-url, SEO builders, passkey-name.
          pnpm -F @th/types exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # Shared leaves that ran in NO workflow until now. All DB-free, ~2s each,
          # and each keeps its own vitest major (errors/test-utils 1.6.1, ports
          # 2.1.9, schema/locale 3.2.4/2.1.9) — pnpm resolves per package.
          # @th/errors — AppError / codes / normalizeError, the contract every
          # transport and adapter normalizes through.
          pnpm -F @th/errors exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/schema — prosemirror doc schema; validates every stored rich-text
          # block. Declared no vitest at all and only ran locally by hoist accident.
          pnpm -F @th/schema exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/ports — search port zod schemas.
          pnpm -F @th/ports exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/test-utils — the shared fakes. A broken fake silently invalidates
          # the core/adapters suites below, so it runs before them.
          pnpm -F @th/test-utils exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/locale — ICU translator + event-date formatting.
          pnpm -F @th/locale exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # Catalog sort order (`sort-messages.mjs --check`). NOT the parity
          # suite above — that compares key sets, this compares byte order, and
          # it is what keeps en.json/es.json line-comparable. Wired here as well
          # as in ci.yml for the reason stated further down: ci.yml triggers on
          # pull_request only, so quality_gate is in practice the only gate that
          # runs. Fix with `pnpm -F @th/locale format:messages`.
          # No --retry/--timeout flags: `pnpm run <script> -- <flags>` drops
          # everything after `--` (see the audio-transcoder note below).
          pnpm -F @th/locale run lint:messages || FAIL=1
          pnpm -F @th/core exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          pnpm -F @th/adapters exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/ui — Design System v2 token invariants + interaction tests.
          pnpm -F @th/ui exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/ui-email — renders the whole transactional template registry.
          # Relies on the `pnpm -F @th/ui-email build` above: its spec imports the
          # package root, whose `main` is dist/index.js.
          pnpm -F @th/ui-email exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/ui-native — the RN palette and the four door-mode tone families,
          # rendered by BOTH apps/scanner and apps/mobile, so a bad contrast
          # pairing ships to two apps. Added to ci.yml first and ONLY there,
          # which left it still running approximately never (see the note above
          # about pull_request); that miss is why the coverage guard now demands
          # a workflow that triggers on a push to main, not merely any workflow.
          pnpm -F @th/ui-native exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # @th/trpc — router contract, RBAC guards, rate limiting, wire shape.
          pnpm -F @th/trpc exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # apps/api — stripe-webhook stays CI-quarantined (hangs in CI with
          # fully mocked deps; runs 590/598 — still green on dev machines).
          pnpm -F api exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 --exclude '**/stripe-webhook.test.ts' || FAIL=1
          # apps/jobs — migration-drift short-circuit guard and friends.
          pnpm -F jobs exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          # apps/audio-transcoder — `test:ci`, not `test`: the two e2e-*.test.ts
          # files need the gcloud Pub/Sub emulator + Java + real R2 creds + a local
          # ffmpeg and a free fixed port. This service IS rolled by this workflow
          # (build_audio_transcoder), so the remaining 9 unit tests gate it.
          #
          # No --retry/--testTimeout here, DELIBERATELY. `pnpm run <script> -- <flags>`
          # puts a literal `--` in vitest's argv and vitest (cac) DROPS everything
          # after it — verified: `run test:ci -- --definitelyNotAVitestFlag` runs
          # green instead of erroring on the unknown flag. So those flags would be a
          # silent no-op, not protection. The suite is 9 pure unit tests in ~2s and
          # apps/audio-transcoder/vitest.config.ts already sets testTimeout: 30000.
          # (Same caveat applies to the `run test:ci --` web step further down.)
          pnpm -F audio-transcoder run test:ci || FAIL=1
          # apps/scanner + apps/mobile — ~180 tests that ran in NO workflow. Not
          # deployed here (EAS ships them via scanner-release.yml /
          # mobile-release.yml), but both consume @th/types, @th/errors, @th/trpc
          # and @th/ui from this tree, so a shared change can break them silently.
          # They are gated HERE and not only in ci.yml because ci.yml triggers on
          # pull_request and this repo pushes straight to main — quality_gate is in
          # practice the only gate that runs.
          # scanner's e2e-appium/*.spec.js are excluded via apps/scanner/vitest.config.ts
          # (Appium/Mocha specs; they die at import under vitest).
          pnpm -F scanner exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          pnpm -F mobile exec vitest --run --retry=1 --testTimeout=30000 --hookTimeout=30000 || FAIL=1
          wait $LINT_PID || FAIL=1
          exit $FAIL

      # apps/web's ~2.6k unit tests (minus a small shrinking quarantine — see
      # apps/web/vitest.ci.config.ts). Run sequentially, not in the parallel block above: the suite
      # is large and the self-hosted runner is single-capacity, so a 4th concurrent vitest risks OOM.
      # Until 2026-07-17 these ran in no gate, so breakage reached main unseen.
      - name: Web unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dev
          TESTCONTAINERS_REUSE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dev
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
        # NO flags here, DELIBERATELY — same `--` trap as the audio-transcoder
        # step above. `pnpm run <script> -- <flags>` puts a literal `--` in
        # vitest's argv and vitest (cac) drops everything after it, so
        # `--retry=1 --testTimeout=30000 --hookTimeout=30000` were a silent
        # no-op here for as long as they were written.
        #
        # This suite ran at vitest's DEFAULT 5s timeout with no retry as a
        # result, while the comment claimed the retry was absorbing
        # moderate-layout's jsdom navigation flake. Run 659 failed on exactly
        # that test — "Test timed out in 5000ms" — and 608/612 were probably
        # the same thing read as ordinary contention.
        #
        # testTimeout / hookTimeout / retry now live in
        # apps/web/vitest.ci.config.ts, where an argv separator cannot swallow
        # them. Do not re-add them here.
        run: pnpm -F web run test:ci

  # ── Build jobs ────────────────────────────────────────────────────────
  build_api:
    name: Build + push api:dev
    needs: [changes, quality_gate]
    if: needs.changes.outputs.do_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── Setup gcloud, retried once ──────────────────────────────────────
      # THE CANONICAL COPY OF THIS NOTE. The same three steps appear at every
      # `setup-gcloud` call site across the deploy, hotfix and terraform
      # workflows; they all point back here.
      #
      # The action downloads and untars the Cloud SDK, and that is the one
      # genuinely flaky thing these jobs do. Run #661 died inside
      # `tar xz --warning=no-unknown-keyword ...` with no further output, which
      # failed `Post-deploy verification` before it ran a single probe — a
      # healthy dev deploy (build, migrate, roll and seed all green, both public
      # endpoints serving the new revision) reported red by a download.
      #
      # A `uses:` step cannot be wrapped in a retry action, since those only
      # re-run shell. So the retry IS a second invocation, gated on the first
      # one's outcome. Re-running is safe: the action re-resolves the SDK and
      # re-adds it to PATH, and holds no state between attempts.
      #
      # `outcome`, not `conclusion`: `continue-on-error` rewrites conclusion to
      # 'success', so gating on that would mean the retry never fires.
      #
      # The `gcloud version` check is what keeps this honest. `continue-on-error`
      # makes a first-attempt failure quiet, so without it a run where BOTH
      # attempts failed would carry on and die at some later step with a
      # confusing error instead of "gcloud is missing". It also means this
      # construction degrades safely if the runner's expression support ever
      # disagrees with us about `outcome` — the worst case is a loud, accurate
      # failure here rather than a silent one further down.
      - name: Setup gcloud
        id: setup_gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup gcloud (retry)
        if: steps.setup_gcloud.outcome == 'failure'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Build and push (api)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}
          AR_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          TAG: dev
          SERVICE: api
          SKIP_BUILD: ${{ vars.SKIP_BUILD }}
        run: |
          repo_host="${REGION}-docker.pkg.dev"
          image_ref="${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${TAG}"

          build_args=()
          if [[ "${SKIP_BUILD:-0}" == "1" ]]; then
            build_args+=(--build-arg SKIP_BUILD=1)
          fi

          # mode=max, NOT min: multi-stage build — the expensive `install`
          # stage (pnpm install, prisma generate, app build) is discarded into
          # the slim runtime stage, so mode=min would cache almost nothing and
          # every build re-ran a cold install.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --cache-from=type=registry,ref=${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:buildcache-v2 \
            --cache-to=type=registry,ref=${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:buildcache-v2,mode=max \
            "${build_args[@]}" \
            -f apps/api/Dockerfile \
            -t "${image_ref}" \
            -t "${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:dev-${GITHUB_SHA::7}" \
            .

  build_web:
    name: Build + push web:dev
    needs: [changes, quality_gate]
    if: needs.changes.outputs.do_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        id: setup_gcloud
        # Retried below — see the note at the first occurrence in deploy-dev.yml.
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup gcloud (retry)
        if: steps.setup_gcloud.outcome == 'failure'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud is on PATH
        run: gcloud version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Build and push (web)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}
          AR_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          TAG: dev
          SERVICE: web
          SKIP_BUILD: ${{ vars.SKIP_BUILD }}
          # Hardcoded (not vars.*) so the dev bundle can't drift from the
          # rebrand domain — mirrors deploy-prod.yml. Next inlines these at
          # build time; updating Cloud Run env can't fix an already-baked value.
          NEXT_PUBLIC_TILESERVER_URL: "https://tiles-dev.ithasfire.com"
          NEXT_PUBLIC_SITE_URL: "https://web-dev.ithasfire.com"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_DEV }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY_DEV }}
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}
          NEXT_PUBLIC_API_BASE_URL: "https://api-dev.ithasfire.com"
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: "development"
          # Repo variables, not secrets — a site domain isn't sensitive. Unset
          # by default so dev traffic never pollutes the stats; set
          # NEXT_PUBLIC_PLAUSIBLE_DOMAIN_DEV only if you register a dev site.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN_DEV }}
          NEXT_PUBLIC_PLAUSIBLE_SRC: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_SRC }}
          # Cloudflare Web Analytics site token — public by design (it ships in
          # the HTML), so a variable rather than a secret. Separate dev token so
          # dev traffic lands in its own site.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN_DEV }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_APP_VERSION: ${{ vars.NEXT_PUBLIC_APP_VERSION }}
          # Sentry source-map upload (build-time). See deploy-prod.yml for rationale;
          # dev uploads to the same project, distinguished by release SHA. Token is
          # scoped to org:read + project:read + project:releases only.
          SENTRY_ORG: "hearth-fire"
          SENTRY_PROJECT: "hearth-fire-web"
          SENTRY_AUTH_TOKEN: ${{ secrets.TF_VAR_SENTRY_AUTH_TOKEN }}
        run: |
          repo_host="${REGION}-docker.pkg.dev"
          image_ref="${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${TAG}"

          build_args=()
          if [[ "${SKIP_BUILD:-0}" == "1" ]]; then
            build_args+=(--build-arg SKIP_BUILD=1)
          fi

          # Next.js inlines NEXT_PUBLIC_* at build time, so pass them as build args.
          [[ -n "$NEXT_PUBLIC_TILESERVER_URL" ]]        && build_args+=(--build-arg "NEXT_PUBLIC_TILESERVER_URL=${NEXT_PUBLIC_TILESERVER_URL}")
          [[ -n "$NEXT_PUBLIC_SITE_URL" ]]               && build_args+=(--build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}")
          [[ -n "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]] && build_args+=(--build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}")
          [[ -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]]     && build_args+=(--build-arg "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}")
          [[ -n "$NEXT_PUBLIC_GEOAPIFY_API_KEY" ]]       && build_args+=(--build-arg "NEXT_PUBLIC_GEOAPIFY_API_KEY=${NEXT_PUBLIC_GEOAPIFY_API_KEY}")
          [[ -n "$NEXT_PUBLIC_API_BASE_URL" ]]           && build_args+=(--build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}")
          [[ -n "$NEXT_PUBLIC_SENTRY_DSN" ]]             && build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}")
          [[ -n "$NEXT_PUBLIC_SENTRY_ENVIRONMENT" ]]     && build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT}")
          [[ -n "$NEXT_PUBLIC_PLAUSIBLE_DOMAIN" ]]       && build_args+=(--build-arg "NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN}")
          [[ -n "$NEXT_PUBLIC_PLAUSIBLE_SRC" ]]          && build_args+=(--build-arg "NEXT_PUBLIC_PLAUSIBLE_SRC=${NEXT_PUBLIC_PLAUSIBLE_SRC}")
          [[ -n "$NEXT_PUBLIC_CF_BEACON_TOKEN" ]]        && build_args+=(--build-arg "NEXT_PUBLIC_CF_BEACON_TOKEN=${NEXT_PUBLIC_CF_BEACON_TOKEN}")

          # Sentry source-map upload — guarded so builds without the token still succeed.
          [[ -n "$SENTRY_AUTH_TOKEN" ]]                  && build_args+=(--build-arg "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}")
          [[ -n "$SENTRY_ORG" ]]                         && build_args+=(--build-arg "SENTRY_ORG=${SENTRY_ORG}")
          [[ -n "$SENTRY_PROJECT" ]]                     && build_args+=(--build-arg "SENTRY_PROJECT=${SENTRY_PROJECT}")

          # Build metadata — always pass (SHA is always available; version defaults to "dev")
          build_args+=(--build-arg "NEXT_PUBLIC_BUILD_SHA=${NEXT_PUBLIC_BUILD_SHA:0:7}")
          build_args+=(--build-arg "NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-dev}")

          # mode=max, NOT min: multi-stage build — the expensive `install`
          # stage (pnpm install, prisma generate, app build) is discarded into
          # the slim runtime stage, so mode=min would cache almost nothing and
          # every build re-ran a cold install.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --cache-from=type=registry,ref=${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:buildcache-v2 \
            --cache-to=type=registry,ref=${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:buildcache-v2,mode=max \
            "${build_args[@]}" \
            -f apps/web/Dockerfile \
            -t "${image_ref}" \
            -t "${repo_host}/${PROJECT_ID}/${AR_REPO}/${SERVICE}:dev-${GITHUB_SHA::7}" \
            .

