name: Scanner Release (EAS)

on:
  push:
    tags:
      - 'scanner-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      submit:
        description: 'Submit to stores after build'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # apps/scanner/app.config.ts reads EXPO_TAP_TO_PAY_TIER at config-evaluation
  # time (none | development | publishing). "none" is the v1.0 production
  # posture: no Tap to Pay entitlement declared, so the binary signs for App
  # Store distribution without Apple's publishing approval. eas.json profiles
  # also pin this per profile (development → "development", production →
  # "none") for the remote build; this workflow-level default keeps local
  # config evaluation by the EAS CLI deterministic.
  EXPO_TAP_TO_PAY_TIER: 'none'

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tRPC package
        run: pnpm -F @th/trpc run build

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
            echo "submit=${{ github.event.inputs.submit }}" >> $GITHUB_OUTPUT
          else
            # Tag push - build production for all platforms
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "profile=production" >> $GITHUB_OUTPUT
            echo "submit=false" >> $GITHUB_OUTPUT
          fi

      # Submission is handled exclusively by the `submit` job below (no
      # --auto-submit here) so a dispatch with submit=true doesn't submit the
      # same build twice.
      - name: Run EAS Build
        working-directory: apps/scanner
        run: |
          eas build --platform ${{ steps.params.outputs.platform }} --profile ${{ steps.params.outputs.profile }} --non-interactive

  # Optional: separate submit job for more control
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event.inputs.submit == 'true' ||
      (startsWith(github.ref, 'refs/tags/scanner-v') && contains(github.ref, '-release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Unlike apps/mobile, the scanner's app.config.ts loads local config
      # plugins via require() and expo-build-properties — `eas submit` has to
      # evaluate that config to resolve the project, so node_modules must be
      # installed in this job too.
      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # iOS submission resolves ascAppId 6784035261 / team FJG7F43395 from
      # apps/scanner/eas.json → submit.production with remote ASC credentials.
      # CI submits iOS ONLY: Android submission needs the Play service account
      # key at .secrets/play-service-account.json (repo root), which is local-
      # only and not materialized in the runner — run `eas submit --platform
      # android` locally until that key is moved to a CI secret.
      - name: Submit to App Store (iOS)
        working-directory: apps/scanner
        run: |
          eas submit --platform ios --profile production --latest --non-interactive
