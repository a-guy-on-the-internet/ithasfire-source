version: "3.9"

services:
  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${HOT_EVENTS_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-dev-data:/data
    command: ["redis-server", "--save", "120", "1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-dev-data:
    name: ithasfire-redis-dev
