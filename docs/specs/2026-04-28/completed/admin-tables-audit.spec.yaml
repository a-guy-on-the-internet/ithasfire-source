version: 1
name: admin-tables-audit
status: shipped  # 2026-10-08 docs consolidation; was: draft
date: 2026-04-28
owners: [ui]

summary: |
  Audit of every admin list/table page under apps/web/src/app/admin/[slug]/**
  and the unification plan to bring the small handful of stragglers onto the
  shared DataTable + AdminTableParts + useAdminTableParams stack. Step 1 of
  the events-list migration is implemented in this PR; the remaining tables
  are sequenced for follow-up PRs.

primitives:
  data_table:
    path: packages/ui/src/ui/tamagui/components/data/DataTable.tsx
    re_export: "@th/ui"
    capabilities:
      - sortable headers (clientSort or controlled sort)
      - per-column align (left | center | right)
      - per-column width (flex weight on native, % on web)
      - per-column noWrap
      - clientSearch (auto or controlled)
      - selection checkboxes
      - row hover + focus-visible highlight (web)
      - column resize handles (web, on by default)
      - sticky <thead>
      - mobile FlashList virtualization (native)
      - skeleton loading (loadingRowCount)
      - emptyState slot
      - rowActions / inline edit
      - renderExpandedRow
  admin_table_parts:
    path: apps/web/src/components/AdminTableParts.tsx
    exports:
      - SkeletonEmptyState
      - ActionBar
      - TableContainer
      - SearchBar
      - FilterChips
      - FilterRow
      - Pagination
      - NoResults
      - ColumnSelector
      - AdminTableErrorState   # added in this PR
  hook:
    path: apps/web/src/hooks/useAdminTableParams.ts
    url_keys: [q, p, ps]
    notes: |
      Owns search (debounced 300ms) + page + pageSize and writes them to the
      URL via router.replace. Filter chips are NOT URL-synced today — every
      consumer keeps statusFilter/etc in local React state.

