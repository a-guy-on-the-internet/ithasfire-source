# Generic FormBuilder Extraction

> Superseded by docs/specs/2026-08-10/application-driven-events.spec.md, which absorbs it in its Phase 4; only the FormBuilder extraction was built (2026-10-08 docs consolidation)

> **Status**: Superseded (2026-10-08 docs consolidation; was: Draft)
> **Created**: 2026-06-26
> **Authors**: Engineering Team
> **Blocks**: `events/volunteering.spec.md` (volunteer signup form reuses this)

## Overview

Extract the existing `ApplicationFormBuilder` component into a generic, reusable `FormBuilder` that can power both the event application form and the new volunteer signup form (and any future form-driven feature). This also renames the shared `ApplicationQuestionType` enum to `FormQuestionType` to reflect its broader usage.

## What already exists

### `ApplicationFormBuilder`

Located at `apps/web/src/app/admin/[slug]/events/new/_components/ApplicationFormBuilder.tsx` (~700 lines).

Capabilities:
- Question CRUD (add, edit, delete, reorder via drag)
- Question type picker: `SHORT_TEXT`, `LONG_TEXT`, `SINGLE_CHOICE`, `MULTI_CHOICE`
- Per-question options management (for choice types)
- Required toggle per question
- Intro text editor
- Saves via tRPC mutations: `upsertApplicationForm`, `upsertApplicationQuestion`, `deleteApplicationQuestion`

### `ApplicationQuestionType` enum

Defined in `packages/db/prisma/enums.prisma`:

```prisma
enum ApplicationQuestionType {
  SHORT_TEXT
  LONG_TEXT
  MULTI_CHOICE
  SINGLE_CHOICE
}
```

### `EventApplicationGate`

Shared UI in `packages/ui/src/ui/tamagui/components/events/EventApplicationGate.tsx` renders the consumer-facing form based on question definitions. This also needs to work generically.

