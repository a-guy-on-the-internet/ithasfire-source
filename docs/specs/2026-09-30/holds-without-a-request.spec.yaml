out_of_scope:
  - The mobile app (own endeavour) and the scanner.
  - Money between place and booker (deal-terms-and-settlement).
  - Creating Humans for people not on the platform.
  - A thread or ledger for request-less holds (audit log only).
  - A platform-wide notification overview (follow-up).
  - Series: a booker's recurring event checks H10 per occurrence date at save; no series-level hold.

# ── Acceptance criteria ──────────────────────────────────────────────────────

acceptance_criteria:
  - A place admin gives an org a grant on one calendar; nothing works for the org until one of its admins accepts; then its editors see that calendar only, as open / held / booked.
  - An editor at the place gets no "Outside bookers" controls; the server refuses them too.
  - The booker holds Fri 17 Oct on an empty line (1st), books it → a DRAFT event owned by the booker exists, confirmed by the place, and the hold is CONFIRMED with eventId set; place staff get email + in-app.
  - The booker holds Sat 18 Oct behind an act's request hold (2nd); Book is absent and refused (HOLD_NOT_FIRST); the booker challenges the act's hold; the act answers keep; the booker is told; the line is unchanged.
  - The place challenges the booker's hold at 1st; the booker lets it lapse → released EXPIRED, the next hold moves up with a notice.
  - The booker saves an event in the builder on a date an act holds → NIGHT_HELD naming the act.
  - Staff hold a date naming a band on the platform → the band gets email + in-app, sees "1st hold" in its holds, passes → the hold stays, unassigned, staff are told.
  - A booker viewing that date sees the place's name, not the note, while it is unassigned; the band's name while named.
  - The place publishes its own event on a date its own hold sits on → that hold is CONFIRMED, other holds on the line lose the date.
  - Revoke with one hold kept and one event's confirmation withdrawn → the kept hold becomes a place hold naming the booker, the other holds release GRANT_ENDED with move-ups, the event drops to address-only, the booker is told.
  - A grant that expires in 7 days warns both sides once; at expiry the booker's holds are released and its events remain.
  - A note written on a booking request by place staff is readable and editable by the sender; the field says who can see it.
