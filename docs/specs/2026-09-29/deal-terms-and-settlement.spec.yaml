# deal-terms-and-settlement.spec.yaml
#
# The agreement states the whole deal — guarantees, versus, door splits,
# deductions off the top — and one calculator shows who is owed what: while the
# terms are being drafted ("if we sell 150 tickets"), and after the show with the
# real numbers. Stage 1 builds the terms and the calculator; the platform keeps
# paying only per-order percentage lines, and the calculator shows what is left
# to settle directly between the parties. Stage 2 (specced, not built) lets the
# platform pay the whole settlement at event end once every recipient is a payee.
#
# Revives the parked plan: docs/specs/2026-08-07/completed/event-settlement-report.spec.md
# (its §5 pipeline and §6 data model are adopted, with the changes below) and
# docs/specs/2026-07-27/completed/compounding-deal-terms-model.spec.md (FIXED/PERCENT
# lines). Reverses, in stage 2 only, the 2026-08 ruling "Ithas Fire records deals;
# it does not execute them" — stage 1 still only records and calculates.
#
# Owner decisions 2026-09-28/29 (grilling after the booking-flow canvas audit):
# S1–S5 and Q47, stamped M1–M7.

version: "1.0"
