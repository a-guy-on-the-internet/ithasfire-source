  # ── 9. Centralize money formatting ────────────────────────────────────────
  - id: money-formatting-helper
    status: done   # 2026-04-26 — formatMoneyCents added at apps/web/src/lib/format-money.ts; remaining (cents/100).toFixed(2) hits are form input bindings or percent-from-bps, not money display
    priority: medium
