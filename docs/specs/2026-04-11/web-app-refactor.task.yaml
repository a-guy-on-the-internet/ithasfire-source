    description: >
      `(cents / 100).toFixed(2)` and ad-hoc `$${dollars}` patterns appear
      across 15+ checkout, order, embed, resale, and admin files. We ship
      money in integer cents (engineering-standards) but format it inline.
      Centralize a single `formatMoneyCents(cents, { currency })` helper so
      currency, locale, and rounding stay consistent (and so future locale
      work has one chokepoint).
    canonical_location: apps/web/src/lib/format-money.ts
    candidate_consumers:
