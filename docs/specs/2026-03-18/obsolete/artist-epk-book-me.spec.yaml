  - docs/specs/2026-07-07/completed/musician-epk-content.spec.yaml
superseded_note: >
  This spec's `current_state` section describes the old Profile/
  ProfileModule model, since replaced by EntityPage/PageBlock — treat as
  historical context only, not ground truth. Its module-kind ideas (tracks,
  video, press, stats, past_shows, rider, genre_tags) are carried forward
  into entity-page-templates.spec.yaml + musician-epk-content.spec.yaml
  against the current data model. The "Book Me" CTA / auto one-sheet PDF
