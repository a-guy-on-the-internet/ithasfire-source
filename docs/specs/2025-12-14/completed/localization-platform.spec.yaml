status: complete
# Spec: Ithas Fire Localization Platform
meta:
  owner: platform
  status: completed
  reviewers:
    - web
    - mobile
    - jobs
    - design-system
  last_updated: 2025-02-14
summary: |
  Establish a unified internationalization and localization platform that serves
  dictionaries, formatting helpers, and locale negotiation for every Ithas Fire
  surface (web, mobile, scanner, email, shared UI). The solution must deliver
  consistent translations, formatting, and fallbacks, while supporting existing
  hexagonal boundaries and enabling future language expansions without
  duplicating message catalogs across apps.
objectives:
  - Ship a shared `@th/locale` package that exposes typed message catalogs, ICU formatting helpers, and async loaders consumable from browser, Node, and React Native runtimes.
  - Integrate `next-intl` in `apps/web` for locale routing/detection while reusing the shared dictionaries.
  - Provide translation utilities for `@th/ui`, `@th/ui-email`, and Expo apps that mirror web hooks (`useTranslations`, `useLocale`).
  - Enable locale-aware formatting (dates, numbers, currency) across all clients without floating-point drift or inconsistent rounding.
  - Document workflows so product/design teams can add or update copy in <1 hour, including QA guidance and testing hooks.
scope:
  in_scope:
    - Designing the shared dictionary format, storage, and type generation workflow.
    - Selecting and integrating localization libraries (`next-intl`, `intl-messageformat`, polyfills).
    - Locale negotiation strategy (headers, URL prefixes, device language, organizer defaults).
    - Updating surface-specific bootstraps (web layout/providers, Expo app root, email renderer) to consume the shared helpers.
    - Tooling for message validation, linting, and tests (unit + snapshot) across packages.
    - Documentation/spec updates for engineering and design workflows.
  out_of_scope:
    - Automatic machine translation or copywriting tooling integration (future evaluation).
    - Localization of analytics dashboards or internal-only tooling (follow-up after core surfaces).
    - Right-to-left (RTL) layout re-theming beyond base direction support (tracked separately).
personas:
  - buyer: Experiences localized UI copy, dates, currencies on web and mobile.
  - organizer_admin: Receives localized notification emails and dashboard messaging.
  - support_agent: Sends localized transactional emails generated by jobs infrastructure.
  - developer: Implements features without duplicating translation logic or touching multiple catalogs.
  - designer/copywriter: Updates copy with clear workflow, previewing translations in Storybook and email previews.
success_metrics:
  - Translation coverage: ≥95% of UI strings across supported locales tracked via lint check (no missing keys at build time).
  - Regression rate: <1% of production incidents tied to localization issues (missing copy, incorrect formatting).
  - Copy update velocity: Time from copy change request to production ≤1 business day with existing tooling.
  - Performance: Locale negotiation + dictionary load adds <20 ms server overhead (p50) and <10 KB bundle delta per locale chunk.
flags:
  - name: feature.localization
    default: false
    rollout: per-surface
    note: Enables locale routing + translators once parity verified per app.
architecture:
  overview:
    - shared_package: |
        `packages/locale` exposes:
          * `messages/<locale>.json` ICU catalogs validated via Zod schemas and ICU parsing checks.
          * `loadMessages(locale)` async loader with dynamic imports for tree-shaking.
          * `createTranslator(locale, messages)` returning `t`, `formatDate`, `formatNumber`, `formatCurrency` powered by `intl-messageformat`.
          * Generated TypeScript types for message keys (build step using `@formatjs/cli`).
    - web: |
        `apps/web` adopts `next-intl`:
          * `middleware.ts` negotiates locale via path/headers/cookie.
          * Root layout wraps children with `NextIntlClientProvider` using shared loader.
          * Server utilities (`getTranslations`, `getFormatter`) proxy to shared translator for RSC support.
          * `generateMetadata` uses localized strings.
    - ui_package: |
        `@th/ui` exports `TranslationProvider` that bridges to existing Tamagui provider and allows Storybook/tests to inject translations without Next.js.
    - emails: |
        `@th/ui-email` and jobs adopt `createTranslator` directly in Node. Templates receive `t` and formatting helpers; snapshot tests cover default + secondary locales.
    - react_native: |
        Expo apps load translations at startup, using `expo-localization` (or `react-native-localize`) to detect device locale, apply polyfills (`@formatjs/intl-*`) and provide context hooks mirroring the web API.
message_lifecycle:
  storage:
    - Source of truth dictionaries kept in `packages/locale/messages`. Each locale file adheres to schema validated in CI.
    - Keys follow `namespace.key` convention (e.g., `eventDetail.schedule`), grouped by domain.
    - Default locale (`en`) is authored first; other locales reference same key structure.
  validation:
    - CI runs `pnpm -F @th/locale lint:messages` and `pnpm -F @th/locale lint:icu` to ensure sorted catalogs and ICU syntax correctness with type-safe parsing.
    - Type generation outputs `messages.generated.d.ts` consumed by apps for autocomplete and compile-time safety.
  editing_workflow:
    - Contributors update JSON + run `pnpm -F @th/locale format:messages` to sort keys alphabetically.
    - Precommit hook ensures dictionaries stay sorted and validated.
    - Optional translation platform integration (e.g., Lokalise) tracked under follow-up.
integration_details:
  web:
    - Add `apps/web/middleware.ts` for locale routing.
    - Update `layout.tsx`, `generateMetadata`, route handlers to pull translations via `getTranslations`.
    - Provide utilities for server actions (`getTranslatorForRequest`) so use cases never import dictionaries directly (respect hexagonal boundaries).
  ui_library:
    - `TranslationProvider` wraps Tamagui + translator context; stories updated to demonstrate locale switching knobs.
    - Component APIs accept `translationId` where static copy previously existed (e.g., buttons, alerts).
  emails/jobs:
    - Background jobs fetch user/org locale preference (default `en`).
    - Job templates call `createTranslator(locale)`; ensure fallback to `en` if locale unsupported.
  - Add unit tests (`pnpm -C apps/jobs test --runInBand --locale`) verifying at least 2 locales per template.
  react_native:
    - Bootstrap file loads locale from device, falls back to `organizer.defaultLocale` if user signed in.
    - Provide offline dictionary bundling strategy (Metro asset plugin) with lazy chunk loading per locale.
    - Add E2E smoke tests verifying language switch (Detox).
observability:
  metrics:
    - localization.missing_keys.count (CI + runtime logging).
    - localization.translator.init_ms (per surface) to monitor startup cost.
    - localization.locale_switch.success / failure for web + RN surfaces.
  logging:
    - Structured warnings when fallback key used at runtime with component/feature context.
  testing:
    - Storybook stories include secondary locale screenshots for visual regression.
    - Emails snapshot per locale stored in `packages/ui-email/__snapshots__`.
rollout_plan:
  phases:
    - phase_0: Ship `@th/locale` package with dictionaries + validation pipeline.
    - phase_1: Integrate `next-intl` + shared translators in `apps/web` (feature flag off by default).
    - phase_2: Update `@th/ui` + Storybook to consume translations; ensure design team can preview.
    - phase_3: Migrate email templates + jobs to shared translator, add regression tests.
    - phase_4: Roll out React Native localization, update QA scripts, enable `feature.localization` for pilot org.
    - phase_5: Enable locale switcher publicly, document workflow, remove flag default.
open_questions:
  - Where should locale preferences live for authenticated users (profile vs org-level override)?
  - Do we need runtime message fetching for late-arriving locales (e.g., remote CDN) or can we rely on bundled assets initially?
  - How will we coordinate with design/copy for RTL-specific layout adjustments beyond base direction?
  - Should pricing-related formatting reuse existing core money helpers or live alongside translators?
dependencies:
  - Add `packages/locale` workspace (pnpm + turborepo config updates).
  - Install `next-intl`, `intl-messageformat`, and required polyfills.
  - Update lint/test pipelines to include localization checks.
  - Schema updates to persist user/org locale preference (ownership TBD).
