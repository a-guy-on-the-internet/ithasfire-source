# ── Risks & Open Questions ───────────────────────────────────────────────────

risks:
  - risk: >
      Versioning — breaking changes to the SDK API require a migration path
      for existing embed consumers.
    severity: MEDIUM
    mitigation: >
      Include `HF.version` in the SDK. Use a versioned path (`/embed/v1/hf-embed.js`)
      from day one so future versions can coexist.
  - risk: >
      CDN caching may serve stale SDK versions after deploys.
    severity: LOW
    mitigation: >
      Use content-hash filenames or a `?v=` cache-buster in the admin snippet.

open_questions:
  - Should the SDK support passing theme overrides in `createWidget()` options (e.g., `theme: { brandColor, bg }`) in addition to URL params? Sure
  - Should we offer an npm package (`@ithasfire/embed`) for framework integrations, or is the global script + React snippet sufficient for now? I feel the package would be nice to have eventually but isn't a blocker for the initial launch since the global script + React snippet covers most use cases.
  - Should `onOrderComplete` include line items or just orderId + total? I think our process sums it for us doesn't it?

# ── Out of Scope ─────────────────────────────────────────────────────────────

out_of_scope:
  - Modal overlay UI (see embed-modal-mode.spec.yaml)
  - postMessage bridge internals (see embed-postmessage-autoresize.spec.yaml)
  - Server-side rendering of embeds
  - Analytics / tracking pixel integration

# ── Acceptance Criteria ──────────────────────────────────────────────────────

acceptance_criteria:
  - A `<script src="/embed/hf-embed.js">` tag + `HF.createWidget({ embedId, container })` renders a working embed.
  - The iframe auto-resizes without the consumer writing any postMessage handling.
  - `onOrderComplete` fires with orderId and totalCents after a successful purchase.
  - `destroy()` removes the iframe and cleans up all event listeners.
  - Admin page shows a "JS SDK" snippet tab with correct copy-paste code.
  - Two widgets on the same page work independently without interference.
