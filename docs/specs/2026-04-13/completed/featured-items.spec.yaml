# Featured Items — Platform Hero Carousel

## Summary

Platform staff can curate a list of featured items (events, artists, organisations, or places)
that rotate as a full-width hero carousel on the consumer homepage. Each item is polymorphic:
a `(itemType, itemId)` pair points at the real entity, with optional display overrides
(title, subtitle, hero image, CTA link/label).

---

## Business Rules

1. **Staff-only curation** — Only users with the `PLATFORM_STAFF` role may upsert or remove items.
2. **Polymorphic targets** — Supported types: `EVENT`, `HUMAN`, `ORGANIZATION`, `PLACE`.
3. **Target must be public** — Upsert is rejected (`invalid_input`) if the referenced entity is not
   publicly visible at the moment of curation:
   - `EVENT` → `status === PUBLISHED && visibility === PUBLIC && slug defined`
   - `HUMAN / ORGANIZATION / PLACE` → published `EntityPage` exists for the entity
4. **Uniqueness** — `(itemType, itemId)` is unique; re-submitting the same pair updates (upserts).
5. **Expiry** — `curatedUntil`, when set, gates the active list: items past their expiry are
   excluded from the public list automatically (no cron required — filtered at query time).
6. **Sort order** — `sortOrder` (0–9999) controls display sequence; default 0.
7. **Public list filtering** — `list` procedure returns only items where `active = true` and
   `curatedUntil IS NULL OR curatedUntil > now()`. CTA URLs are validated to be internal paths
   (`/…`) before being returned to clients; invalid paths are nulled out.
8. **Audit** — Every upsert and remove emits an audit log entry via `repos.audit`.

---

## Data Model

```prisma
model FeaturedItem {
  id               String           @id @default(uuid())
  itemType         FeaturedItemType          // EVENT | HUMAN | ORGANIZATION | PLACE
  itemId           String           @map("item_id")

  title            String?                   // display override — falls back to entity name in UI
  subtitle         String?
  heroImageUrl     String?          @map("hero_image_url")   // internal path e.g. /cdn/hero.jpg
  ctaUrl           String?          @map("cta_url")          // internal path e.g. /events/my-gig
  ctaLabel         String?          @map("cta_label")

  sortOrder        Int              @default(0)    @map("sort_order")
  active           Boolean          @default(true)
  curatedByHumanId String?          @map("curated_by_human_id")
  curatedAt        DateTime         @default(now()) @map("curated_at")
  curatedUntil     DateTime?        @map("curated_until")
  notes            String?          // internal staff notes, never exposed publicly

  @@unique([itemType, itemId])
  @@index([active, sortOrder])
  @@index([curatedByHumanId])
  @@index([curatedUntil])
  @@map("featured_items")
}
```

Migration: `packages/db/prisma/migrations/20260413000001_add_featured_items/`

