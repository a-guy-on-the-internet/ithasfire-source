## Use Cases

All use cases live in `packages/core/src/use-cases/platform/featured-items/`.

### `upsertFeaturedItem`

| Field | Notes |
|---|---|
| Actor | `actorHumanId` — must hold `PLATFORM_STAFF` role |
| Input | `itemType`, `itemId` (UUID), optional display overrides, `sortOrder`, `active`, `curatedUntil`, `notes` |
| Guards | Role check → target-is-public check → upsert |
| Output | `{ item: FeaturedItemRecord }` |
| Errors | `not_authorized`, `invalid_input` (unknown type, non-public target) |
| Audit | `platform.featured_item.upserted` |

### `removeFeaturedItem`

| Field | Notes |
|---|---|
| Actor | `actorHumanId` — must hold `PLATFORM_STAFF` role |
| Input | `itemType`, `itemId` |
| Guards | Role check → existence check |
| Output | `{ ok: true }` |
| Errors | `not_authorized`, `not_found` |
| Audit | `platform.featured_item.removed` |

### `listFeaturedItems` (public)

| Field | Notes |
|---|---|
| Actor | None — unauthenticated |
| Input | `limit` (1–100, default 20), optional `itemType` filter |
| Filter | `active = true AND (curatedUntil IS NULL OR curatedUntil > now())` |
| Output | Enriched `PublicFeaturedItem[]` — `ctaUrl` stripped if not a valid internal path |

### `listFeaturedAdminItems` (staff)

| Field | Notes |
|---|---|
| Actor | `actorHumanId` — must hold `PLATFORM_STAFF` role |
| Input | `limit`, `offset` |
| Output | Paginated `{ items: FeaturedItemRecord[], total: number }` — all items regardless of active/expiry |

