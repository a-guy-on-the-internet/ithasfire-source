## UI

### FeaturedHeroCarousel (`apps/web/src/app/_components/home/FeaturedHeroCarousel.tsx`)

- Full-width hero component rendered on the consumer homepage.
- CSS slide-track animation; auto-advances every 6 s; pauses on hover.
- Dot navigation; responsive (stacks on mobile).
- Per-type badge (EVENT / ARTIST / ORGANISATION / PLACE) via i18n keys.
- Falls back gracefully when `items` array is empty (renders nothing).

### Platform Admin Page (`apps/web/src/app/platform/featured/`)

- Route: `/platform/featured`
- Staff can create / update / remove featured items via a form + list.
- `FeaturedItemForm` — item type selector, UUID input, display override fields, CTA URL with
  per-type placeholder and i18n hint (e.g. *"Use /events/<slug>"*), sort order, active toggle,
  optional expiry date, notes.
- `FeaturedItemList` — paginated table; inline remove button with optimistic update.
- Navigation entry in `ADMIN_SECTIONS` in `apps/web/src/app/platform/[slug]/layout.tsx`.

