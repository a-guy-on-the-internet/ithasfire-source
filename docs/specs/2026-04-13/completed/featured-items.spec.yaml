## Security Notes

- CTA URLs validated as internal paths (`/…`, no `//` prefix) — prevents open-redirect via
  `ctaUrl`. Invalid paths are silently nulled before returning to public clients.
- Hero image URLs receive the same internal-path validation.
- No PII in audit log entries.
