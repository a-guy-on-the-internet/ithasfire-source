# ── Risks & Open Questions ───────────────────────────────────────────────────

risks:
  - risk: >
      Some CMS platforms (e.g., Wix) may restrict inline scripts from creating
      fixed-position overlays or manipulating `document.body.style`.
    severity: MEDIUM
    mitigation: >
      Test on major CMS platforms (WordPress, Squarespace, Wix) during QA.
      Document known limitations in the CMS guides.
  - risk: >
      Overlay z-index may conflict with host page modals or sticky headers.
    severity: LOW
    mitigation: >
      Use an extremely high z-index (999999). Document that the overlay sits
      above all host content.
  - risk: >
      Mobile Safari has quirks with fixed positioning inside iframes and with
      body scroll lock.
    severity: MEDIUM
    mitigation: >
      Use the well-tested `position: fixed; inset: 0` pattern with
      `-webkit-overflow-scrolling: touch` for the iframe container. Test on
      iOS Safari specifically.

open_questions:
  - Should closing the modal mid-checkout warn the user ("You have items in your cart")? Yes
  - Should the modal support a `modalTriggerElementId` option (like Eventbrite) to attach to an existing button on the page instead of rendering a new one? yeah
  - Should we support a URL-based modal trigger (e.g., `#th-checkout`) for SEO-friendly deep linking? SEO FRIENDLY DEEP LINKING

# ── Out of Scope ─────────────────────────────────────────────────────────────

out_of_scope:
  - Inline embed mode (already exists)
  - JS SDK infrastructure (see embed-js-sdk.spec.yaml)
  - postMessage bridge (see embed-postmessage-autoresize.spec.yaml)
  - Multiple concurrent modals from different widgets

# ── Acceptance Criteria ──────────────────────────────────────────────────────

acceptance_criteria:
  - A "Get Tickets" button renders in the container when `mode: "modal"` is set.
  - Clicking the button opens a fullscreen overlay with the embed iframe.
  - The overlay closes on X click, backdrop click, or Escape key.
  - Background scroll is locked while the overlay is open.
  - Focus is trapped inside the overlay (tab cycles through close button and iframe).
  - On mobile (< 640px), the overlay is edge-to-edge fullscreen.
  - Completing a purchase auto-closes the overlay after the confirmation screen displays.
  - The admin page offers a "Modal" snippet variant.
