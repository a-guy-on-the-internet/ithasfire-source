status: complete
# embed-modal-mode.spec.yaml
#
# Modal/popup embed mode — open the widget in a fullscreen overlay triggered by a button.

version: "1.0"
updated: "2026-04-13"

# ── Summary ──────────────────────────────────────────────────────────────────

summary:
  problem: >
    Inline iframes consume vertical space on the host page and can feel intrusive,
    especially on mobile where a 600px+ iframe dominates the viewport. Many embed
    consumers want a "Get Tickets" button that opens the checkout in a modal overlay,
    taking zero space until the user interacts. Eventbrite supports this via
    `modal: true` in their SDK.
  solution: >
    Add a `mode: "modal"` option to the JS SDK. When active, the SDK renders a
    trigger element (button or custom element) and opens a fullscreen / near-fullscreen
    overlay containing the embed iframe when clicked. The overlay includes a close
    button, backdrop click-to-close, and Escape key dismissal.
  users:
    - embed consumer (site owner who prefers a button trigger over inline iframe)
    - end user (ticket buyer)
  surfaces:
    - embed
    - web (admin snippet generation)

# ── Requirements ─────────────────────────────────────────────────────────────

requirements:
  functional:
    - id: FR-001
      description: >
        `HF.createWidget({ mode: "modal", ... })` renders a trigger button inside
        the specified container instead of an iframe.
    - id: FR-002
      description: >
        Clicking the trigger opens a fullscreen overlay (`position: fixed`,
        `inset: 0`, `z-index: 999999`) with a centered iframe (max-width 520px,
        100% height minus safe-area padding).
    - id: FR-003
      description: >
        The overlay includes a visible close button (top-right X icon) and closes
        on backdrop click or Escape key press.
    - id: FR-004
      description: >
        When the overlay opens, `document.body` gains `overflow: hidden` to prevent
        background scrolling. Restored on close.
    - id: FR-005
      description: >
        The trigger button is styleable via SDK options: `triggerText` (default
        "Get Tickets"), `triggerStyle` ("branded" | "outline" | "unstyled", default
        "branded"). "branded" uses Ithas Fire orange; "outline" renders a bordered
        button; "unstyled" renders a bare `<button>` for full CSS control.
    - id: FR-006
      description: >
        The overlay includes a subtle entrance animation (fade + scale from 95%)
        and exit animation (fade out). Total animation duration < 200ms.
    - id: FR-007
      description: >
        On mobile viewports (< 640px), the overlay is truly fullscreen (no margin,
        no rounded corners). On desktop, the overlay has 24px margin and 12px
        border-radius.
    - id: FR-008
      description: >
        The `hf:orderComplete` postMessage auto-closes the overlay after a brief
        delay (1.5s) to let the confirmation screen display.
    - id: FR-009
      description: >
        The iframe inside the modal still auto-resizes within the overlay bounds
        (scrollable if content exceeds viewport height).
    - id: FR-010
      description: >
        The admin page snippet for modal mode generates:
        ```html
        <script src=".../hf-embed.js"></script>
        <div id="th-tickets"></div>
        <script>
          HF.createWidget({
            embedId: "abc",
            container: "#th-tickets",
            mode: "modal",
            triggerText: "Get Tickets"
          });
        </script>
        ```

  non_functional:
    - id: NFR-001
      description: >
        The modal overlay is accessible: focus is trapped within the overlay,
        the close button is the first focusable element, Escape closes it,
        and `aria-modal="true"` + `role="dialog"` are set.
    - id: NFR-002
      description: >
        The overlay renders above all host page content regardless of stacking
        context (z-index: 999999).
    - id: NFR-003
      description: >
        Opening the modal lazy-loads the iframe (src is only set when the overlay
        opens), avoiding hidden network requests on page load.

