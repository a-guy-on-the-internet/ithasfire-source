# ─────────────────────────────────────────────────────────────────────────
# Risks specific to deployment (product risks live in the other spec)
# ─────────────────────────────────────────────────────────────────────────

risks:
  - risk: >
      Apple takes >4 weeks on publishing entitlement review and
      blocks our first POS-needing customer.
    severity: MEDIUM
    mitigation: >
      File the request today. v1.0 ships scan-only regardless. Worst
      case: that customer's first event uses self-serve walk-up
      checkout (signed QR → buyer's phone) — same fallback we'd use
      if they were on the wrong device anyway.

  - risk: >
      App Store rejects v1.0 because the binary contains Stripe
      Terminal SDK code with no exposed UI ("dead code" concern).
    severity: LOW
    mitigation: >
      Have a one-paragraph response ready: "Stripe Terminal SDK is
      installed in preparation for a forthcoming POS feature. The
      feature is server-flag-disabled and not exposed in this build.
      Once Apple grants Tap to Pay publishing entitlement we will
      submit a follow-up build with the feature enabled." Apple
      historically accepts this.

  - risk: >
      OTA update accidentally enables Sell UI on a v1.0 binary,
      crashing the app at first POS attempt.
    severity: HIGH
    mitigation: >
      The binarySupportsTapToPay() check is the safety net. NEVER
      gate on the server flag alone. Lint rule (or PR-review checklist
      item) to ensure Sell-related code paths always check
      binarySupportsTapToPay() first.

  - risk: >
      EAS Update channel mis-targeting (preview update lands on
      production users).
    severity: MEDIUM
    mitigation: >
      Strict channel naming: development | preview | production.
      Production deploys via tagged release in CI only; no manual
      `eas update --channel production` from a developer laptop.

