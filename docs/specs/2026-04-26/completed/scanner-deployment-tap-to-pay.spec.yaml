    sentry_org: "hearth-fire"
    sentry_project: "hearth-fire-mobile"
    sentry_project_id: "4511289359335424"
    sentry_dsn: "https://3ac5479451cb9cfcdac0018d01cad6c7@o4511120392454144.ingest.us.sentry.io/4511289359335424"
    note: >
      DSN is intentionally NOT embedded in app.config.ts (unlike scanner).
      Comes through EXPO_PUBLIC_SENTRY_DSN env var only — set in the
      EAS profile env or local shell. Means a missing DSN silently
