decisions_made:
  bundle_id:
    ios: "com.ithasfire.scanner"
    android: "com.ithasfire.scanner"
    decided: "2026-04-26"
  android_strategy: >
    Ship Google Play Internal Testing in parallel with iOS TestFlight
    Internal — same EAS workflow, no extra cost to keeping them in sync.
    Decided 2026-04-26.
  sentry:
    org_slug: "hearth-fire"
    project_slug: "hearth-fire-scanner"
    project_id: "4511284791607296"
    dsn: "https://a334111b8354f829475f8067510ebfc1@o4511120392454144.ingest.us.sentry.io/4511284791607296"
    note: >
      DSN is public/safe to embed in client binaries. Sourcemap upload
      uses SENTRY_AUTH_TOKEN as an EAS Secret — never inlined in app
      config.
    decided: "2026-04-26"
  app_store_distribution:
    mode: "Unlisted App"
    rationale: >
      Scanner is an operator/staff tool, not a consumer app. Unlisted
      avoids ASO/marketing work, prevents bounce-rate damage from
      casual downloads hitting the auth gate, and is still a real
      App Store distribution (full review). Direct link distribution
      from the Ithas Fire web admin once an org's staff is onboarded.
      Request via App Store Connect → App Information after first
      submission is approved.
    decided: "2026-04-26"
  brand_assets:
    status: "deferred until App Store submission week"
    plan: >
      Screenshots from real working scanner screens are sufficient for
      Unlisted App distribution. App icon: square crop of existing
      Ithas Fire mark (no transparency, 1024x1024). Description: short
      paragraph. Keywords: irrelevant for Unlisted but field-required;
      stub with "ithasfire,scanner,tickets,events".
    decided: "2026-04-26"

