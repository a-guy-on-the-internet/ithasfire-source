  - "EAS production profile (tier=none) builds, signs, and uploads to
    App Store Connect successfully WITHOUT requiring Apple Tap to Pay
    publishing entitlement."
  - "binarySupportsTapToPay() returns false in v1.0 builds; the Sell
    tab does not render even if the server flag is forced to true via
    devtools."
  - "When EXPO_TAP_TO_PAY_TIER is flipped to 'publishing' (locally,
    pre-Apple-approval), `eas build --profile production` fails to
    sign with a clear Apple-side error — proving the gate works."
  - "App Review Information includes a working demo account, a
    recorded demo video, and a one-paragraph explanation of the
    SDK-installed-but-disabled state."
  - "[DONE 2026-05-27] Apple DEVELOPMENT entitlement granted on App ID
    com.ithasfire.scanner (team 5J9DRDR2TB). Capability checkbox
    visible & enabled in Identifiers UI."
  - "[TODO] Confirm Apple PUBLISHING entitlement status (separate
    approval, not visible in Identifiers UI). Check email or trial-
    submit a production build."

follow_ups:
  android_tap_to_pay:
    status: post-v1
    notes: >
      Same SDK, different entitlement model (Google Play handles it
      via store-level capability rather than per-app entitlement).
      Plan: ship v1.0 to Play Store with NFC permission declared but
      Tap to Pay code-gated. Flip on with v1.1 alongside iOS.

  eas_workflows:
    status: post-v1.1
    rationale: >
      EAS Workflows replaces GitHub Actions for build orchestration.
      Worth migrating once we have ≥2 EAS-built apps (e.g. add
      audio-transcoder or a future Ithas Fire consumer mobile app).
      For one app, GitHub Actions + `eas build --auto-submit` is fine.

  ota_update_strategy:
    status: post-v1.0
    rationale: >
      EAS Update's value scales with iteration speed. Pre-launch we
      ship infrequently; post-launch with real operators we'll want
      hotfix capability for JS-only changes (typo fixes, copy tweaks,
      flow adjustments). Wire `expo-updates` in v1.0 (already in
      app.config.ts above) so the channel is ready when we need it.
