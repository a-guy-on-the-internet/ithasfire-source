risks:
  - risk: >
      Tap to Pay availability gating — iOS 16.4+ on iPhone XS+ only,
      Android NFC + Android 11+ only. Older devices in the operator
      fleet will see the Sell tab hidden with no clear reason.
    severity: MEDIUM
    mitigation: >
      Detect SDK availability at boot via the Terminal SDK's
      `supportsReadersOfType` check; surface a one-line "Tap to Pay
      not supported on this device" footer in the Sell-tab placeholder
      so the operator knows it's a device limitation, not a bug.
  - risk: >
      Connect account in restricted state — sales succeed at the
      gate but funds get held by Stripe.
    severity: HIGH
    mitigation: >
      `pos.startSale` re-checks `payee.chargesEnabled` AND
      `payee.payoutsEnabled` at sale time, not just at tab-render
      time. Reject with `payee_restricted` error and surface a
      "Charges disabled — contact your org owner" banner.
  - risk: >
      Walk-up "guest" Humans collide with future real signups for the
      same email.
    severity: MEDIUM
    mitigation: >
      Keep the existing email-uniqueness invariant. If a Human with
      that email already exists, attach the order to it. If not,
      create a guest with no password and source=POS_WALKUP. When
      the buyer later signs up with the same email, existing
      account-claim flow merges them (already implemented for
      magic-link onboarding).
  - risk: >
      Refund abuse — staff issuing refunds to friends after the sale.
    severity: MEDIUM
    mitigation: >
      Gate-refund is ORG_EDIT_ROLES only (not SCAN). Every refund
      writes to the audit log with actorHumanId and orderId. The
      15-min window keeps the on-device list small and prevents the
      scanner from becoming a generic refund console.
  - risk: >
      Network drops mid-collection leave an in-flight PaymentIntent.
    severity: MEDIUM
    mitigation: >
      Stripe Terminal SDK handles in-flight recovery on reconnect.
      Server-side, the existing payment_intent.canceled webhook
      already drives the Order back to CANCELLED. Operator sees a
      clear "Sale failed — try again" state and no double charge.
  - risk: >
      Connected account missing `card_present` capability — POS
      sales fail at PI create time with "capability not active".
      Existing test/seed accounts in our DB do not have it requested.
    severity: HIGH
    mitigation: >
      (a) Adapter revision: `createConnectAccount` requests
      `card_present` alongside `card_payments` and `transfers`.
      (b) Backfill script run against all existing test + prod
      Connect accounts before M7 end-to-end test. (c) Rollout
      gating: `pos.startSale` checks `payee.capabilities.card_present
      === "active"` and surfaces a clear "POS not enabled — contact
      org owner" error rather than a Stripe 400.
  - risk: >
      Tax handling at the door — venue tax stamping on web checkout
      relies on a known billing address; walk-up buyers don't enter
      one.
    severity: MEDIUM
    mitigation: >
      Use the EVENT's venue address as the tax origin for POS sales
      (same data we already have). Document this as an explicit
      contract: door sales tax = venue-jurisdiction tax.

open_questions:
  - Multi-currency — current spec assumes the event's currency. POS
    inherits it. No multi-currency UX.
  - Anonymous order reconciliation — when buyerHumanId is null, how
    do we surface those in the org's "recent orders" admin views?
    Probably as "Walk-up sale · {time}" without a buyer column.
    Confirm with admin UI before build.

out_of_scope:
  - External Bluetooth readers (BBPOS WisePOS, Verifone P400)
  - Cash / split tender
  - Tipping (codified anti-tipping stance, see FR-014)
  - Promo code redemption at the door
  - Per-operator till reconciliation reports
  - Multi-variant merch (size/color matrices) — see follow-up
  - Refunds older than 15 minutes from the device (use web admin)

follow_ups:
  merch_freeform_amount:
    status: planned-next-likely-cheap
    rationale: >
      Most punk-show merch is "tape, $5. patch, $3. shirt, $20." The
      operator does not want to maintain a catalog. They want to type
      a number and an optional label, tap a card, and move on.

      This collapses the merch problem to its smallest form:
        - No SKU model.
        - No inventory counter.
        - No variants.
        - No QR. No email. No admission.
        - Order with a single OrderItem of kind=MERCH_FREEFORM,
          amount = whatever the operator typed, label = whatever
          string they typed (or "Merch" if blank).

      Uses the same PaymentIntent + Settlement pipe as ticket sales.
      The only NEW data is `OrderItem.kind` enum extension and a
      nullable `OrderItem.label` for the freeform string. No new
      table.

      Build cost on top of v1 POS: roughly half a day. Worth shipping
      adjacent to the ticket POS since the UI is one extra "Custom
      amount" tile on the Sell screen.

  merch_at_pos:
    status: planned-after-freeform
    why_not_now: >
      Merch belongs in this same flow. Same operator, same phone,
      same Connect account, same Settlement pipeline. The reason it
      isn't IN v1 is purely scope discipline — we want one shippable
      slice (tickets-at-the-door) before we widen the catalog.
    feasibility_summary: >
      Lower than it looks. The Order/PaymentIntent/Settlement pipe
      is sale-shape-agnostic. What's missing is a non-ticket sellable
      item model. Three options, in ascending cleanliness:

        A. Hijack TicketType. Add `kind: TICKET | MERCH` and
           `deliveryKind: ADMISSION | NONE`. Merch items mint a
           "ticket" with deliveryKind=NONE and never need to scan.
           Cheapest path; pollutes the TicketType model's semantics.

        B. New `DoorItem` model. (id, eventId, name, priceCents,
           inventory, kind=MERCH, optional variants:JSONB). Sales
           still flow through Order + OrderItem (existing model
           accepts a polymorphic itemRef). Cleanest separation;
           one new table + one migration to make OrderItem polymorphic.

        C. Generalise to `SellableItem` across tickets + merch +
           future (parking, locker, drink ticket). Largest blast
           radius; deferred.

      Recommendation when we tackle it: option B. Roughly 2–3 days
      of build time on top of the v1 POS slice (model + admin
      catalog UI + sell-screen item type-switching).
    inventory_invariants:
      - Merch inventory is a simple int counter on DoorItem; no
        seat semantics, no holds, no reservations. Decrement
        atomically inside the same Prisma tx as Order create.
      - Out-of-stock surfaces as a greyed item on the Sell screen
        with "0 left" — do not let operators add to cart.
    delivery:
      - No QR. No email. No SMS. The buyer walks away with the
        physical merch. Receipt remains the same opt-in URL as
        ticket sales.
    out_of_v1_for_merch:
      - Variants (S/M/L, colors) — track as a single flat SKU per
        size/color combo for v1, or punt entirely to v2.
      - Restock workflows — merch counter is org-admin editable in
        the catalog UI; no PO / receiving flow.
      - Sales tax category overrides per merch item — inherit
        venue-jurisdiction tax for v1.

acceptance_criteria:
  - An operator with SCANNER role on a Connect-enabled org event sees
    a Sell tab in the scanner Home and can complete a $1 test sale
    end-to-end on iPhone in Tap to Pay sandbox mode WITHOUT entering
    any buyer contact.
  - A successful anonymous sale produces an Order with
    paymentChannel="POS", SUCCEEDED status, buyerHumanId=NULL, a
    minted Ticket with status=SCANNED (auto-admit), and an entry in
    the same Settlement queue as a web order of the same amount.
  - The home screen's admitted counter increments immediately on a
    successful POS sale — no second scan needed.
  - '"Send receipt" with email creates / attaches a POS_WALKUP guest Human and sends the standard ticket email.'
  - The Sell screen renders the anti-tipping disclosure copy in full
    and the Stripe Terminal SDK does NOT show a tip prompt during
    collection.
  - When the org's Payee is RESTRICTED, the Sell tab is hidden and
    a forced sale attempt server-side returns `payee_restricted`.
  - Refunding a POS sale within 15 minutes via the device produces
    the same ledger entries as a web refund of the same order. The
    refunded ticket is moved to status=REFUNDED and the admit
    counter decrements.
  - Telemetry shows the full pos.* event chain for a successful
    sale with no PAN or buyer-PII fields in the payloads.
  - A POS sale produces a platform-balance charge (NOT on the
    connected account). The resulting Settlement is transferred
    to the connected account by the existing
    `executeSettlementTransfer` job, with `source_transaction` set
    to the card-present charge ID. Total platform fee for the POS
    order matches the web fee policy for an order of the same
    amount and event.
  - A cash sale of $30 produces an Order with paymentChannel=CASH,
    status=SUCCEEDED, amountCents=3000, no stripePaymentIntentId,
    no Settlement row, with a minted Ticket auto-admitted per
    FR-013. The home screen admit counter increments immediately.
  - A cash sale at $0 (comp) produces the same Order shape with
    amountCents=0, mints a Ticket, auto-admits, and writes an audit
    entry attributable to actorHumanId. No Stripe call ever fires
    on this path.
  - Refunding a cash sale within 15 minutes via the device flips
    Order and Ticket status to REFUNDED, decrements the admit
    counter, and writes an audit entry. No payment-processor call
    occurs. The Sell tab is available even with `card_present`
    capability inactive on the connected account, so long as at
    least one TicketType is on sale.

rollout:
  feature_flag: scanner.pos_tap_to_pay
  default: 'ON globally; gating is per-event (FR-001 conditions — at least one TicketType on sale + scanner role; card path additionally requires chargesEnabled + card_present capability).'
  migration:
    - DECISION D-2026-04-26 — confirm via 30-min dev spike that
      Tap to Pay PI creation on the platform account (no
      `stripeAccount` header) succeeds against a Stripe test
      Connect account with `card_present` active. Block M4.2 until
      green.
    - Revise M3 adapter `createCardPresentPaymentIntent` to drop
      `stripeAccountId` and `applicationFeeAmount` args; update
      port signature accordingly.
    - Add `card_present` capability request to `createConnectAccount`
      + run one-shot backfill script against existing accounts.
    - Ship Order.paymentChannel (WEB | POS | CASH, default WEB) +
      TicketType.doorPriceCents (nullable) + Human.source
      migrations behind no-op defaults.
    - Add Stripe Terminal SDK to apps/scanner; gate the new tab on
      device capability (no global flag check).
    - Add `pos.connectionToken` first; verify in dev with a Stripe
      test Connect account.
    - Add `startPosSale` + `completePosSale` + tRPC procedures.
    - Wire scanner Sell screen end-to-end against Stripe sandbox.
    - Flip on. Watch pos.tap_to_pay.collect_failed by decline_code;
      watch Settlement creation parity vs web orders for the first
      week of real sales.
