# booking-the-night.spec.yaml
#
# Where a booking becomes an event. The sender agreeing the terms books the night
# and creates the draft event; a venue may instead book without terms, but only
# on a night the pitch asked for. Holds go back to being pencil: the standalone
# hold confirm leaves the request flow.
#
# Written 2026-09-25 while fitting the bill (lineup-booking-requests-v3) and
# venue booking standards (v1.1) into the flow as it runs. Owner decisions from
# the grilling rounds that day are stamped N1–N12, each with the stage it acts
# on. Every flow fact below was checked against the working tree that day; the
# file:line references are the evidence.

