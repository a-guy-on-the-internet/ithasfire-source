# volunteer-management-unification.spec.yaml
#
# Unify the two volunteer-management surfaces — the per-event tabbed view and
# the standing-ask single-scroll monolith — onto one shared component
# foundation, and redesign the ask admin experience as a tabbed surface that
# closes its parity gaps (role delete, template/pack application) and gives the
# freshly-shipped shift occurrences (phase A, commit eff42e71) a first-class
# Schedule home.

version: "1.0"
updated: "2026-08-04"

# ── Summary ──────────────────────────────────────────────────────────────────

summary:
  problem: >
    Two admin surfaces manage volunteering and they have diverged into
    different products. The per-event surface (VolunteersView) is a tabbed
    view (roles | signups | rewards) with roving-tabindex keyboard nav, a
    full inline shift composer, and template/pack application. The
    standing-ask surface (AskManageView) is ONE 1430-line file rendering one
    long scrolling page — lifecycle, pending queue, roles, groups, general
    pool, broadcasts — under a file-wide @ts-nocheck. They share only three
    leaf components. The ask side cannot delete a role (the router exposes
    askRoles.add/update only), cannot apply templates or packs, and has
    nowhere to put the occurrence scheduling that shipped server-side in
    eff42e71 ("UI ships in a separate pass" — this is that pass). Every
    fix to one surface is invisible to the other.
  solution: >
    One shared foundation in apps/web/src/components/volunteering/, built
    by extraction rather than rewrite. A shared tab shell (roving tabindex,
    generalized from VolunteersView) and a shared pending-queue section
    (extracted from AskManageView) land first as behaviour-preserving
    refactors. The transport gaps close next: askRoles.delete (guarded, not
    cascade) and askRoles.createFromTemplates. Then AskManageView is rebuilt
    on the shell as five tabs — Overview | Roles & Schedule | Signups |
    Groups | Broadcasts — decomposed into per-tab files, with the Schedule
    UI (occurrence list/create/cancel + roster with assign/check-in) riding
    the already-shipped volunteer.schedule.* endpoints. Finally the
    per-event side adopts the ask side's best idea: the pending-queue-first
    signups layout and a pending-count tab badge. The coordinator console
    keeps working untouched.
  users:
    - Org / place / personal owners running standing asks
    - Organizers running per-event volunteering
    - Group coordinators (indirectly — their console must not regress)
  surfaces:
    - web
    - api

