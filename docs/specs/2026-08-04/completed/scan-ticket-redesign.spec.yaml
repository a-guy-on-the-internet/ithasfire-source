# scan-ticket-redesign.spec.yaml
#
# Redesign of the ticket-scanning surfaces: the native scanner app's unified
# scan flow (apps/scanner) and the existing web admin scan page
# (apps/web/src/app/admin/[slug]/scan). Door-operator UX under door-operator
# conditions: dark room, loud PA, one hand, flaky venue wifi.
#
# REALITY CHECK ENCODED UP FRONT: the current scanner is far more complete
# than institutional memory says. Project memory claims "SCANNER NOT migrated
# to @th/ui-native" — that is STALE: unified-scan-screen.tsx:48-61 imports
# ScreenSurface/SquareCard/TopBar/useThemedSheet from @th/ui-native, App.tsx:160
# mounts NativeThemeProvider, and DEFAULT_NATIVE_THEME is already "stub"
# (packages/ui-native/src/palette.ts:416). Likewise, most features a scan
# redesign would naively propose ALREADY EXIST: torch toggle
# (src/ui/torch-button.tsx), brightness boost (src/lib/use-brightness-boost.ts),
# manual code entry + unified person search (unified-scan-screen.tsx:429-472,
# unified-search-screen.tsx), recent-scans strip with a 30s undo
# (src/screens/recent-scans-strip.tsx:17), offline admit queue with exponential
# backoff (src/lib/use-scan-queue.ts), a synced SQLite ticket/people manifest
# (src/lib/local-db.ts, src/lib/use-local-sync.ts), scanned/total capacity
# counter (src/screens/home-screen.tsx:50-63,144-212), event-selector
# persistence in SecureStore (src/lib/storage.ts:3-24,
# src/scanner-app.tsx:198), haptic+sound outcome feedback (src/lib/feedback.ts),
# and a11y result announcements (unified-result-view.tsx:157-215).
#
# This spec therefore does NOT re-specify what shipped. It closes the gaps a
# code audit actually found — the biggest being that the RESOLVE step is
# online-only while everything around it (manifest, admit queue) is
# offline-first — and finishes the last mile of visual/feedback design for
# dark-venue, one-handed operation.
#
# Companion doc: docs/decisions/scanner-distribution-native-internal-tracks.md owns
# HOW operators get the scanner (store listings, onboarding email, install
# URLs, the dead /invitations/accept link). This spec owns what the scan
# surfaces look like and do. The ONE overlap — the web page's missing
# fallback QR decoder on iOS Safari (that memo's "actually broken" item 4) —
# is specified here as FR-012 because it is a scan-surface capability;
# the memo references it as a prerequisite for its Option B.

version: "1.0"
updated: "2026-08-04"

# ── Summary ──────────────────────────────────────────────────────────────────

summary:
  problem: >
    Three findings from auditing the scan surfaces in code. (1) The offline
    story has a hole in the middle: the scanner syncs a full local ticket
    manifest and queues admits offline, but the resolve step — camera decode
    to "who is this / can they come in" — is a server-only
    utils.scan.resolvePayload.fetch (unified-scan-screen.tsx:138-141), so
    with no connectivity the camera path dies with an error banner while the
    answer sits in SQLite on the device. Undo and volunteer check-in are
    likewise online-only mutations. (2) Throughput and feedback are tuned for
    a desk, not a door: every admission costs two taps and three server round
    trips (resolve, admit, re-resolve — unified-scan-screen.tsx:200-204), the
    result renders as a bordered card in a scroll region rather than an
    unmissable full-screen state, and the audio cues are one ~40-byte
    embedded WAV click replayed at three playback rates
    (src/lib/feedback.ts:57-63) — indistinguishable over a PA, atop the
    deprecated expo-av. Already-scanned and wrong-event share one "warning"
    haptic (unified-scan-screen.tsx:119-130), so in the dark the operator
    must read to tell "seen this ticket" from "wrong show". (3) The web scan
    page is TWO implementations behind a feature gate
    (apps/web/src/app/admin/[slug]/scan/page.tsx:207-222): the legacy branch
    admits a camera-decoded ticket IMMEDIATELY with no confirmation step
    (page.tsx:333-342 — decode calls scanTicket directly), relies on
    BarcodeDetector with no fallback (page.tsx:910-912; iOS Safari cannot
    camera-scan), and drifts from the unified branch's status copy — the
    scanner handles VOID but not LISTED (unified-result-view.tsx:482-491),
    the web unified view handles LISTED but not VOID and mislabels INVALID
    as "Voided" (UnifiedScanView.tsx:1205-1219).
  solution: >
    Local-first resolve: when the device is offline (or the resolver fails
    network-classified), resolve ticket codes against the already-synced
    manifest and render an explicitly-labelled offline result that can admit
    through the existing queue — never a dead end, never a fabricated pass.
    Door-mode presentation: full-screen tone result states (colour + icon +
    text + distinct haptic + distinct tone per outcome, reduced-motion-safe),
    an opt-in express auto-admit for VALID scans that collapses admission to
    zero taps with the undo strip as the safety net, and a persistent stats
    strip (admitted/total, queue depth, offline state) on the scan screen
    itself. Reach: scan-screen controls consolidated into a bottom rail
    inside one-handed thumb reach. One status-copy source shared by both
    surfaces, covering all six ticket statuses. On the web: delete the
    legacy branch (and with it the confirm-less camera admit), make
    UnifiedScanView the only implementation, and add a WASM fallback decoder
    so iPhone browsers can actually scan. Design-system position: the
    scanner is ALREADY on @th/ui-native + Stub default — the FR here is to
    finish the residual hybrid (Tamagui YStack/@th/ui Text islands), not to
    migrate.
  users:
    - Door operators (org OWNER / ADMIN / EDITOR / SCANNER) scanning tickets
      and volunteer passes at entry, often in the dark, one-handed, offline
    - Organizers using the web admin scan page as a no-install fallback
    - Volunteers presenting signed QR passes (scanned, not scanning)
  surfaces:
    - mobile (apps/scanner — primary)
    - web (/admin/[slug]/scan — secondary, exists today)
    - api (touched, not extended — see architecture)

